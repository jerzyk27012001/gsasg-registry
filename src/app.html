/* ========================= live backend (Supabase) =========================
   The hosted build sets window.GSASG_CONFIG and includes the Supabase client.
   Without them the app runs as the self-contained demo with synthetic data.
   Every access rule lives in the database; this code only asks for data, and
   the server returns what the signed-in person is allowed to see. */
const SB_CFG = window.GSASG_CONFIG || null;
const LIVE = !!(SB_CFG && SB_CFG.url && SB_CFG.anonKey && window.SupabaseLib);
let sb = null, liveSession = null, liveProfile = null, authMode = 'signin', authMsg = null;
const saveState = {pending:new Set(), timer:null, error:null, saving:false};

/* Dates survive the trip through the database as {$d: ISO string} */
function ser(c){
  const {__new, ...rest} = c;
  return JSON.parse(JSON.stringify(rest, function(k,v){ const raw=this[k]; return raw instanceof Date? {$d:raw.toISOString()} : v; }));
}
function revive(o){
  return JSON.parse(JSON.stringify(o), (k,v)=> v && typeof v==='object' && !Array.isArray(v) && '$d' in v && Object.keys(v).length===1 ? new Date(v.$d) : v);
}
function roleLabel(p){
  return p.role==='ini_admin'? 'INI administrator' : p.role==='site_user'? 'Site user' : 'Awaiting approval';
}
function paintSave(){
  const n=document.getElementById('saveChip'); if(!n) return;
  if(!LIVE || !liveProfile){ n.style.display='none'; return; }
  n.style.display='';
  n.className='savechip'+(saveState.error?' err':'');
  n.textContent = saveState.error? 'Not saved — tap to retry'
    : (saveState.saving||saveState.pending.size)? 'Saving…' : 'All changes saved';
  n.title = saveState.error||'';
}
function liveQueue(c){
  if(!LIVE || !c || !liveProfile) return;
  saveState.pending.add(c.id);
  clearTimeout(saveState.timer); saveState.timer=setTimeout(liveFlush, 400);
  paintSave();
}
async function liveFlush(){
  if(!LIVE || saveState.saving) return;
  const ids=[...saveState.pending]; if(!ids.length) return;
  saveState.saving=true; paintSave();
  const rows=ids.map(id=>ALL_CASES.find(c=>c.id===id)).filter(Boolean)
    .map(c=>({id:c.id, site:c.site, data:ser(c)}));
  let error=null;
  try{ ({error} = await sb.from('cases').upsert(rows)); }catch(e){ error=e; }
  saveState.saving=false;
  if(error){ saveState.error = error.message || String(error); toast('Could not save — '+saveState.error); }
  else { ids.forEach(id=>saveState.pending.delete(id)); saveState.error=null; }
  paintSave();
  if(!error && saveState.pending.size) liveFlush();
}
window.addEventListener('beforeunload', e=>{
  if(LIVE && (saveState.pending.size || saveState.saving)){ e.preventDefault(); e.returnValue=''; }
});

async function liveLoadCases(){
  const rows=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from('cases').select('id,site,data').order('id').range(from,from+999);
    if(error) throw error;
    rows.push(...data);
    if(data.length<1000) break;
  }
  ALL_CASES.length=0;
  rows.forEach(r=>{
    const c=revive(r.data); c.id=r.id; c.site=r.site;
    c.construct=classify(c.levels);
    if(c.date instanceof Date) c.daysSince=Math.max(0, Math.floor((Date.now()-c.date)/864e5));
    ['meds','tests','aes','queries','audit','comorbidities','procedures','visitsExtra'].forEach(k=>{ if(!Array.isArray(c[k])) c[k]=c[k]||[]; });
    if(!c.proms) c.proms={}; if(!c.radio) c.radio={};
    ALL_CASES.push(c);
  });
  applyScope();
}
async function liveEnter(session){
  liveSession=session;
  const {data,error}=await sb.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();
  if(error || !data){ authMode='error'; authMsg='Your account was created, but its profile could not be loaded. '+(error?error.message:'Ask INI to check the database setup.'); go('auth'); return; }
  liveProfile=data;
  if(data.role==='pending'){ authMode='pending'; go('auth'); return; }
  currentUser = {id:data.user_id, email:data.email, name:data.full_name||data.email,
    role: data.role==='ini_admin'? 'INI administrator' : 'Site user', scope: data.role==='ini_admin'? 'all' : data.site};
  try{ await liveLoadCases(); }
  catch(e){ authMode='error'; authMsg='Signed in, but the registry could not be loaded: '+(e.message||e); go('auth'); return; }
  document.body.classList.remove('signedout');
  paintWho(); paintSave(); go('dash');
}
async function liveSignOut(){
  if(saveState.pending.size) await liveFlush();
  await sb.auth.signOut();
  liveSession=null; liveProfile=null; ALL_CASES.length=0; applyScope(); draft=null;
  authMode='signin'; authMsg=null; paintSave(); paintWho(); go('auth');
}

/* ---------- sign-in, sign-up, password reset, waiting for approval ---------- */
function renderAuth(){
  document.body.classList.add('signedout');
  const wrap=el('div',{class:'authwrap'});
  const msg = authMsg? el('div',{class:'banner'+(authMode==='error'?' crit':''),style:'margin-bottom:14px'},
    el('span',{html:authMode==='error'?ICON.alert:ICON.info}), el('div',{},authMsg)) : null;
  const head = el('div',{class:'authhead'},
    el('div',{html:iniMark(40)}),
    el('div',{}, el('div',{class:'t1'},'GSASG Registry'), el('div',{class:'t2'},'Global Spinal Arthroplasty Study Group · Institute of Neuro Innovation')));
  const busy = (btn,on)=>{ btn.disabled=on; btn.textContent = on? 'Please wait…' : btn.dataset.label; };
  const B = (label, fn, cls='btn') => { const b=el('button',{class:cls,type:'submit'},label); b.dataset.label=label; return b; };

  if(authMode==='pending' || authMode==='error'){
    wrap.append(el('div',{class:'authcard'}, head, msg,
      authMode==='pending'? el('div',{},
        el('h2',{},'Waiting for approval'),
        el('p',{class:'sub'}, `You are signed in as ${liveProfile?liveProfile.email:''}. An INI administrator needs to give your account access to a site before you can see patients. You can close this page; access starts the next time you sign in.`)) : null,
      el('div',{class:'row',style:'margin-top:16px;gap:8px'},
        el('button',{class:'btn sec',type:'button',onclick:async()=>{ const {data}=await sb.auth.getSession(); if(data.session) liveEnter(data.session); }},'Check again'),
        el('button',{class:'btn sec',type:'button',onclick:liveSignOut},'Sign out'))));
    return wrap;
  }

  const email=el('input',{class:'inp',type:'email',autocomplete:'email',required:true,placeholder:'name@example.com'});
  const pw=el('input',{class:'inp',type:'password',autocomplete:authMode==='signup'?'new-password':'current-password',required:true,minlength:'8',placeholder:'At least 8 characters'});
  const name=el('input',{class:'inp',type:'text',autocomplete:'name',placeholder:'First Last'});
  const field=(l,n)=>el('label',{class:'f'},el('span',{},l),n);
  let form;

  if(authMode==='recover'){
    const sub=B('Save new password');
    form=el('form',{onsubmit:async e=>{ e.preventDefault(); busy(sub,true);
        const {error}=await sb.auth.updateUser({password:pw.value}); busy(sub,false);
        if(error){ authMsg=error.message; authMode='recover'; go('auth'); return; }
        authMsg='Password updated.'; const {data}=await sb.auth.getSession(); if(data.session) liveEnter(data.session); }},
      el('h2',{},'Choose a new password'), field('New password',pw), sub);
  } else if(authMode==='forgot'){
    const sub=B('Send reset link');
    form=el('form',{onsubmit:async e=>{ e.preventDefault(); busy(sub,true);
        const {error}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname});
        busy(sub,false); authMsg= error? error.message : 'If that email has an account, a reset link is on its way.'; authMode='forgot'; go('auth'); }},
      el('h2',{},'Reset your password'), field('Email',email), sub,
      el('button',{class:'linkbtn',type:'button',onclick:()=>{authMode='signin';authMsg=null;go('auth');}},'Back to sign in'));
  } else {
    const up = authMode==='signup';
    const sub=B(up?'Create account':'Sign in');
    form=el('form',{onsubmit:async e=>{
        e.preventDefault(); busy(sub,true); authMsg=null;
        if(up){
          const {data,error}=await sb.auth.signUp({email:email.value.trim(), password:pw.value,
            options:{data:{full_name:name.value.trim()}, emailRedirectTo:location.origin+location.pathname}});
          busy(sub,false);
          if(error){ authMsg=error.message; go('auth'); return; }
          if(data.session){ liveEnter(data.session); return; }
          authMode='signin'; authMsg='Account created. Check your email for a confirmation link, then sign in here.'; go('auth');
        } else {
          const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(), password:pw.value});
          busy(sub,false);
          if(error){ authMsg = /confirm/i.test(error.message)? 'Please confirm your email first — check your inbox for the link.' : error.message; go('auth'); return; }
          liveEnter(data.session);
        }
      }},
      el('div',{class:'chips',style:'margin-bottom:16px'},
        el('button',{class:'chip',type:'button','aria-pressed':String(!up),onclick:()=>{authMode='signin';authMsg=null;go('auth');}},'Sign in'),
        el('button',{class:'chip',type:'button','aria-pressed':String(up),onclick:()=>{authMode='signup';authMsg=null;go('auth');}},'Create account')),
      up? field('Full name',name) : null,
      field('Email',email), field('Password',pw), sub,
      up? el('p',{class:'hint',style:'margin-top:12px'},'New accounts get access once INI approves them, or straight away if INI has already invited your email.')
         : el('button',{class:'linkbtn',type:'button',onclick:()=>{authMode='forgot';authMsg=null;go('auth');}},'Forgot your password?'));
  }
  wrap.append(el('div',{class:'authcard'}, head, msg, form,
    el('div',{class:'hint',style:'margin-top:18px'}, el('a',{href:'#',onclick:e=>{e.preventDefault();go('pitch');}},'← About the registry'))));
  setTimeout(()=>{ const i=wrap.querySelector('input'); if(i) try{ i.focus(); }catch(e){} }, 50);
  return wrap;
}

/* ---------- users & access (INI only) ---------- */
let demoConfirm=false;
function renderUsers(){
  const out=el('div',{});
  if(!isINI()){ out.append(el('div',{class:'banner'},el('span',{html:ICON.info}),el('div',{},'Only INI administrators manage accounts.'))); return out; }
  if(!LIVE){
    out.append(el('div',{class:'banner'},el('span',{html:ICON.info}),
      el('div',{},el('b',{},'Demo mode. '),'In the hosted registry, INI administrators approve new accounts, assign each person to a site, and invite people by email here. These are the demo accounts.')),
      el('div',{class:'mt'}, card('Accounts','',
        tableEl([{label:'Name',key:'n'},{label:'Role',key:'r'},{label:'Access',key:'s'}],
          ACCOUNTS.map(a=>({n:a.name, r:a.role, s:a.scope==='all'?'All sites':siteShort(a.scope)}))))));
    return out;
  }
  const body=el('div',{},el('div',{class:'hint'},'Loading…'));
  out.append(body);
  (async()=>{
    const [{data:profiles,error:e1},{data:invites,error:e2}] = await Promise.all([
      sb.from('profiles').select('*').order('created_at'),
      sb.from('invites').select('*').order('created_at')]);
    body.innerHTML='';
    if(e1||e2){ body.append(el('div',{class:'banner crit'},el('span',{html:ICON.alert}),el('div',{},(e1||e2).message))); return; }
    const siteSel=(val,onch)=>el('select',{class:'inp',onchange:onch},
      [el('option',{value:''},'— site'), ...ALL_SITES.map(s=>el('option',{value:s,selected:val===s?'selected':null},siteShort(s)))]);
    const roleSel=(val,onch)=>el('select',{class:'inp',onchange:onch},
      [['pending','No access'],['site_user','Site user'],['ini_admin','INI administrator']].map(([v,l])=>el('option',{value:v,selected:val===v?'selected':null},l)));
    const pending=profiles.filter(p=>p.role==='pending');

    const userRow = p => {
      let role=p.role, site=p.site||'';
      const save=el('button',{class:'btn sm',type:'button',onclick:async()=>{
        if(role==='site_user' && !site){ toast('Choose a site for a site user'); return; }
        if(p.user_id===liveProfile.user_id && role!=='ini_admin'){ toast('You cannot remove your own INI access'); return; }
        const {error}=await sb.from('profiles').update({role, site: role==='site_user'? site : null}).eq('user_id',p.user_id);
        toast(error? 'Not saved — '+error.message : 'Access updated for '+p.email); go('users'); }},'Save');
      return el('div',{class:'userrow'},
        el('div',{}, el('strong',{},p.full_name||p.email), p.full_name? el('div',{class:'hint',style:'margin:0'},p.email) : null),
        roleSel(role,e=>{role=e.target.value;}), siteSel(site,e=>{site=e.target.value;}), save);
    };
    if(pending.length) body.append(card(`Waiting for approval (${pending.length})`,'Choose a role and a site, then save.',
      el('div',{class:'userlist'}, pending.map(userRow))));
    body.append(el('div',{class:'mt'}, card('Everyone with access','INI administrators see every site. Site users see only their own site.',
      el('div',{class:'userlist'}, profiles.filter(p=>p.role!=='pending').map(userRow)))));

    /* invites */
    const iEmail=el('input',{class:'inp',type:'email',placeholder:'name@example.com'});
    const iName=el('input',{class:'inp',placeholder:'Full name'});
    let iRole='site_user', iSite='';
    body.append(el('div',{class:'mt'}, card('Invite someone','They create an account with this email and get access straight away.',
      el('div',{class:'userrow'},
        iEmail, iName,
        roleSel(iRole,e=>{iRole=e.target.value;}),
        siteSel(iSite,e=>{iSite=e.target.value;}),
        el('button',{class:'btn sm',type:'button',onclick:async()=>{
          const em=iEmail.value.trim().toLowerCase();
          if(!/^\S+@\S+\.\S+$/.test(em)){ toast('Enter a valid email'); return; }
          if(iRole==='pending'){ toast('Choose a role'); return; }
          if(iRole==='site_user' && !iSite){ toast('Choose a site'); return; }
          const {error}=await sb.from('invites').upsert({email:em, full_name:iName.value.trim()||null, role:iRole, site: iRole==='site_user'? iSite : null});
          toast(error? 'Not saved — '+error.message : 'Invite saved for '+em+'. Send them the registry link.'); go('users'); }},'Invite')),
      invites.length? el('div',{class:'mt'}, tableEl([{label:'Invited email',key:'e'},{label:'Role',key:'r'},{label:'Site',key:'s'},{label:'',key:'x'}],
        invites.map(i=>({e:i.email, r:i.role==='ini_admin'?'INI administrator':'Site user', s:i.site?siteShort(i.site):'All sites',
          x:el('button',{class:'revealbtn',type:'button',onclick:async()=>{ await sb.from('invites').delete().eq('email',i.email); go('users'); }},'remove')})))) : null)));

    /* demo data */
    const demoN = ALL_CASES.filter(c=>/^DEMO-/.test(c.id)).length;
    body.append(el('div',{class:'mt'}, card('Demo patients','Synthetic patients for showing the registry. Their case numbers start with DEMO-. Remove them before real enrollment begins.',
      el('div',{class:'row',style:'gap:10px;align-items:center'},
        el('span',{}, demoN? `${demoN} demo patients loaded.` : 'No demo patients loaded.'),
        demoN? el('button',{class:'btn sec sm',type:'button',onclick:async()=>{
            if(!demoConfirm){ demoConfirm=true; toast('Tap "Remove demo patients" again to confirm'); go('users'); return; }
            demoConfirm=false;
            const {error}=await sb.from('cases').delete().like('id','DEMO-%');
            if(error){ toast('Not removed — '+error.message); return; }
            await liveLoadCases(); toast('Demo patients removed'); go('users'); }}, demoConfirm? 'Tap again to remove them all' : 'Remove demo patients')
          : el('button',{class:'btn sm',type:'button',onclick:async e=>{
            e.target.disabled=true; e.target.textContent='Loading…';
            const rows=DEMO_CASES.map(c=>{ const d=ser(c); const id='DEMO-'+c.id.replace('MPSR-',''); d.id=id; return {id, site:c.site, data:d}; });
            for(let k=0;k<rows.length;k+=40){
              const {error}=await sb.from('cases').insert(rows.slice(k,k+40));
              if(error){ toast('Stopped — '+error.message); break; }
            }
            await liveLoadCases(); toast('Demo patients loaded'); go('users'); }}, `Load ${DEMO_CASES.length} demo patients`)))));
  })();
  return out;
}

/* ============================ sign in ============================ */
function renderLogin(){
  const card_ = a => el('button',{class:'acct',type:'button','aria-current':String(currentUser.id===a.id),
      onclick:()=>signIn(a)},
    el('div',{class:'nm'},a.name), el('div',{class:'rl'},a.role),
    el('span',{class:'sc'+(a.scope==='all'?'':' site')}, a.scope==='all'? 'Sees all sites' : 'Sees only '+siteShort(a.scope)));
  return el('div',{},
    el('div',{class:'banner'},
      el('span',{html:ICON.info}),
      el('div',{},el('b',{},'Demo sign-in. '),
        'Pick an account to see the registry the way that person would. In the production registry every user has their own password and two-factor login, and the server sends each site only its own patients.')),
    el('div',{class:'sect mt'}, el('h2',{},'INI — all sites')),
    el('div',{class:'acctgrid'}, ACCOUNTS.filter(a=>a.scope==='all').map(card_)),
    el('div',{class:'sect mt'}, el('h2',{},'Participating sites — own site only')),
    el('div',{class:'acctgrid'}, ACCOUNTS.filter(a=>a.scope!=='all').map(card_)));
}

/* ============================ router ============================ */
const SCREENS = {
  pitch: {title:'MPSR', crumb:'The case for a motion preservation registry', icon:'info', nav:'The case', render:renderPitch},
  dash:  {title:'Dashboard', crumb:'Site and registry-wide overview', icon:'dash', nav:'Overview', render:renderDashboard},
  cases: {title:'Cases', crumb:'All enrolled cases', icon:'list', nav:'Cases', render:renderCases},
  case:  {title:'Case record', crumb:'Operative, radiographic and PROM history', icon:'list', hidden:true, render:renderCase},
  new:   {title:'Enroll case', crumb:'Operative record and construct builder', icon:'plus', nav:'Enroll case', render:renderNew},
  risk:  {title:'Risk calculator', crumb:'Point-of-care prediction from the registry cohort', icon:'dash', nav:'Risk calculator', render:renderRisk},
  radio: {title:'Radiographic', crumb:'Segmental motion, ossification, adjacent levels', icon:'xray', nav:'Radiographic', render:renderRadio},
  proms: {title:'PROMs & follow-up', crumb:'Instruments, schedule and capture', icon:'survey', nav:'PROMs & follow-up', render:renderProms},
  quality:{title:'Data quality', crumb:'Queries, validation rules and audit trail', icon:'check', nav:'Data quality', render:renderQuality},
  sites: {title:'Sites & screening', crumb:'Site scorecards, enrollment funnel and external linkage', icon:'cohort', nav:'Sites & screening', render:renderSites},
  dose:  {title:'Motion & outcome', crumb:'Dose-response: does preserved motion protect the adjacent level?', icon:'dash', nav:'Motion & outcome', render:renderDose},
  planner:{title:'Study planner', crumb:'Sample size, enrollment period and time to the answer', icon:'dash', nav:'Study planner', render:renderPlanner},
  epro:  {title:'Patient portal', crumb:'What the patient receives, and the outreach ladder', icon:'survey', nav:'Patient portal', render:renderEpro},
  cohort:{title:'Cohort query', crumb:'Investigator and sponsor view', icon:'cohort', nav:'Cohort query', render:renderCohort},
  model: {title:'Data model', crumb:'Schema, standards, governance, build path', icon:'db', nav:'Data model', render:renderModel},
  reports:{title:'Reports & export', crumb:'Publication tables, methods text and de-identified data', icon:'survey', nav:'Reports & export', render:renderReports},
  users: {title:'Users & access', crumb:'Approve accounts, assign sites, invite people', icon:'cohort', nav:'Users & access', render:renderUsers, iniOnly:true},
  auth:  {title:'Sign in', crumb:'', icon:'cohort', hidden:true, render:renderAuth},
  login: {title:'Switch account', crumb:'Choose who you are signed in as', icon:'cohort', hidden:true, render:renderLogin},
};
const NAV_SECTIONS = [
  {label:'Start here', keys:['pitch']},
  {label:'Registry', keys:['dash','cases','new','risk']},
  {label:'Follow-up', keys:['radio','proms','epro']},
  {label:'Operations', keys:['quality','sites','users']},
  {label:'Analysis', keys:['reports','dose','cohort','planner','model']},
];
let current='pitch';
function buildNav(){
  const box=$('#navlist'); box.innerHTML='';
  const q=dueNow().length;
  const oq=allQueries().filter(x=>x.status==='Open').length;
  NAV_SECTIONS.forEach(sec=>{
    box.append(el('div',{class:'navgroup'},sec.label));
    sec.keys.forEach(k=>{
      const s=SCREENS[k];
      if(s.iniOnly && !isINI()) return;
      box.append(el('button',{class:'navitem',type:'button','aria-current':String(current===k),
        onclick:()=>go(k),
        html:ICON[s.icon]+`<span>${esc(s.nav)}</span>`
          +(k==='proms'&&q?`<span class="pill">${q}</span>`:'')
          +(k==='quality'&&oq?`<span class="pill">${oq}</span>`:'')}));
    });
  });
}
function go(k){
  current = SCREENS[k]? k : 'dash';
  if(LIVE && !['pitch','auth'].includes(current) && !(liveProfile && liveProfile.role!=='pending')) current='auth';
  if(LIVE && current==='login') current='auth';
  if(current!=='auth') document.body.classList.remove('signedout');
  if(SCREENS[current].iniOnly && !isINI()) current='dash';
  const s=SCREENS[current];
  $('#scTitle').textContent = current==='case' && openCaseId ? openCaseId : s.title;
  $('#scCrumb').textContent = s.crumb;
  /* the landing page is its own header — the app chrome would only repeat it */
  $('.topbar').style.display = current==='pitch' ? 'none' : '';
  $('#content').style.maxWidth = current==='pitch' ? 'none' : '';
  document.body.classList.remove('navopen');
  const c=$('#content'); c.innerHTML='';
  c.append(s.render());
  buildNav();
  try{ window.scrollTo({top:0,behavior:'instant'}); }catch(e){}
}
function toast(msg){
  const t=el('div',{style:`position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--nav);color:var(--nav-ink);padding:10px 16px;border-radius:22px;
    font-size:13px;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.28)`},msg);
  document.body.append(t);
  setTimeout(()=>t.remove(),2400);
}
/* mobile nav drawer */
const closeNav = ()=>document.body.classList.remove('navopen');
$('#burger').addEventListener('click',()=>document.body.classList.toggle('navopen'));
$('#scrim').addEventListener('click',closeNav);

/* theme */
$('#themeBtn').addEventListener('click',()=>{
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
  $('#themeBtn').textContent = dark? 'Switch to dark':'Switch to light';
  go(current);
});
$('#brandGlyph').innerHTML = iniMark(34);
$('#switchBtn').addEventListener('click',()=>go('login'));
applyScope(); paintWho();
if(LIVE){
  sb = SupabaseLib.createClient(SB_CFG.url, SB_CFG.anonKey,
    {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  $('#switchBtn').textContent='Sign out';
  $('#switchBtn').replaceWith($('#switchBtn').cloneNode(true));
  $('#switchBtn').addEventListener('click', ()=>{ if(liveSession) liveSignOut(); else go('auth'); });
  currentUser={name:'Not signed in', role:'', scope:'all'}; paintWho();
  $('#saveChip').addEventListener('click', ()=>{ if(saveState.error){ saveState.error=null; liveFlush(); } });
  document.querySelector('.proto').innerHTML='<i></i> Demo data — not for patient information';
  sb.auth.onAuthStateChange((evt, session)=>{
    if(evt==='PASSWORD_RECOVERY'){ authMode='recover'; authMsg=null; liveSession=session; go('auth'); }
  });
  go('pitch');
  sb.auth.getSession().then(({data})=>{ if(data.session && authMode!=='recover') liveEnter(data.session); });
} else {
  go('pitch');
}
