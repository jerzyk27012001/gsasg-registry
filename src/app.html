        el('button',{class:'btn sec sm',type:'button',style:'margin-left:auto;flex:0 0 auto',onclick:()=>go('proms')},'Open queue'))),

    el('div',{class:'grid g21 mt'},
      card('Segmental range of motion over time','Mean flexion-extension in degrees at index levels, by construct. Hover for n at each timepoint.',
        legendNode(groupRomSeries()),
        tableToggle(
          lineChart({series:romSeries, xLabels:RADIO_TPS.map(k=>TP[k].label),
            yLabel:'degrees', valFmt:v=>fmt(v,1)}),
          ()=>tableEl(
            [{label:'Construct',key:'g'},...RADIO_TPS.map(k=>({label:TP[k].label,key:k,num:true,mono:true}))],
            romSeries.map((s,i)=>{
              const row={g:s.name};

            }))

        el('p',{class:'hint',style:'margin-top:10px'},

      card('Construct mix','Top constructs by volume.',

let caseFilter = {region:'all', family:'all', q:''};
function renderCases(){
  const fam = [['all','All constructs'],['adr','ADR'],['facet','Facet arthroplasty'],
               ['hybrid','Hybrid'],['dynamic','Dynamic'],['fusion','Fusion (comparator)']];
  const filtered = ()=>CASES.filter(c=>{
    if(caseFilter.region!=='all' && c.region!==caseFilter.region) return false;
    if(caseFilter.family!=='all' && c.construct.family!==caseFilter.family) return false;
    if(caseFilter.q){
      /* Every word typed must appear somewhere: name in either order, date of
         birth in either format, case ID, construct, surgeon or diagnosis. */
      const dob = c.dob? [c.dob.toISOString().slice(0,10), dateStr(c.dob)].join(' ') : '';
      const hay = [c.id, c.name, lastFirst(c.name), dob, c.construct.type, c.construct.signature,
        c.site, c.surgeon, c.dx].join(' ').toLowerCase();
      const words = caseFilter.q.toLowerCase().split(/[\s,]+/).filter(Boolean);
      if(!words.every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  const body = el('div',{});
  const countEl = el('strong',{});
  /* Searching repaints the table only. Re-rendering the screen would rebuild
     the search box itself, dropping focus and closing the phone keyboard. */
  const draw = ()=>{
    const rows = filtered();
    countEl.textContent = `${rows.length} case${rows.length===1?'':'s'}`;
    body.innerHTML='';
    body.append(tableEl(
      [{label:'Patient',key:'pt'},{label:'Date of birth',key:'dob',mono:true},
       {label:'Case · surgery',key:'id'},{label:'Construct',key:'cx'},
       {label:'Levels',key:'rail'},{label:'Last X-ray',key:'lr',mono:true},
       {label:'ROM',key:'rom',num:true,mono:true},{label:'Last PROM',key:'lp',mono:true},
       {label:'Flags',key:'flags'}],
      rows.map(c=>{
        const lr=latestRadio(c), lp=latestProm(c);
        const rv = lr? romAt(c,lr.k) : null;
        const flags=[];
        if(c.construct.hybrid) flags.push(el('span',{class:'tag o'},'Hybrid'));
        if(c.ankylosed) flags.push(el('span',{class:'tag r'},'Ankylosed'));
        if(c.hoGrade>=3) flags.push(el('span',{class:'tag r'},'HO '+c.hoGrade));
        if(c.asd) flags.push(el('span',{class:'tag r'},'ASD'));
        if(c.reop) flags.push(el('span',{class:'tag r'},'Reop'));
        return {
          pt: el('strong',{style:'white-space:nowrap'}, lastFirst(c.name)),
          dob: c.dob? el('span',{style:'white-space:nowrap'},dateStr(c.dob)) : '—',
          id: el('div',{style:'white-space:nowrap;line-height:1.35'}, c.id,
                el('div',{style:'font-size:11.5px;color:var(--muted)'}, dateStr(c.date))),
          cx: el('span',{class:'tag '+(c.construct.hybrid?'o':c.construct.family==='fusion'?'':'b')}, c.construct.type),
          rail: railFor(c),
          lr: lr? TP[lr.k].label : '—',
          rom: rv==null? '—' : fmt(rv,1)+'°',
          lp: lp? TP[lp.k].label : '—',
          flags: flags.length? el('span',{class:'row',style:'gap:4px'},flags) : el('span',{class:'st mute'},'—'),
          __click:()=>openCase(c.id)
        };
      }), {empty:'No cases match these filters'}));
  };
  draw();

  return el('div',{},
    el('div',{class:'row',style:'margin-bottom:14px'},
      el('div',{class:'chips'}, [['all','All regions'],['Cervical','Cervical'],['Lumbar','Lumbar']].map(([v,l])=>
        el('button',{class:'chip',type:'button','aria-pressed':String(caseFilter.region===v),
          onclick:()=>{caseFilter.region=v;go('cases');}},l))),
      el('div',{class:'chips'}, fam.map(([v,l])=>
        el('button',{class:'chip',type:'button','aria-pressed':String(caseFilter.family===v),
          onclick:()=>{caseFilter.family=v;go('cases');}},l))),
      el('div',{class:'spacer'}),
      el('input',{class:'inp',style:'width:300px;max-width:100%',type:'search',
        placeholder:'Search name, date of birth or case ID…',value:caseFilter.q,
        oninput:e=>{caseFilter.q=e.target.value;draw();}})),
    card(null,null,
      el('div',{class:'row',style:'margin-bottom:10px'},
        countEl,
        el('span',{class:'hint',style:'margin:0'},'Click a row to open the case record'),
        el('div',{class:'spacer'}),
        el('button',{class:'btn sm',type:'button',onclick:()=>go('new')},'Enroll new case')),
      body)
  );

/* Entry-time validation. Hard rules block the save; soft rules warn and are
   recorded as a query rather than silently accepted. */
function validateVisit(c, st){
  const P=[], W=[];
  const num=v=>v===''||v==null? null : Number(v);
  const rng=(v,lo,hi,label)=>{ const n=num(v); if(n==null) return;
    if(Number.isNaN(n) || n<lo || n>hi) P.push(`${label} must be between ${lo} and ${hi}`); };
  rng(st.primary,0,100, c.region==='Cervical'?'NDI':'ODI');
  rng(st.axial,0,10,'NRS '+(c.region==='Cervical'?'neck':'back'));
  rng(st.limb,0,10,'NRS '+(c.region==='Cervical'?'arm':'leg'));
  rng(st.eq5d,-0.59,1,'EQ-5D-5L index');
  if(st.imaging==='Yes'){
    Object.entries(st.rom||{}).forEach(([l,v])=>{
      const n=num(v); if(n==null) return;
      if(Number.isNaN(n) || n<0 || n>25) P.push(`Segmental ROM at ${l} must be between 0 and 25°`);
      const tx = c.levels[l]? c.levels[l].tx : null;
      if(tx && TX[tx] && TX[tx].motion===false && n>0)
        P.push(`${l} is recorded as fused — it cannot carry ${n}° of motion`);
    });
    if(!Object.values(st.rom||{}).some(v=>v!==''))
      W.push('Imaging marked as performed but no segmental angles entered');
  }
  if(st.tp){
    const t=TIMEPOINTS.find(x=>st.tp.startsWith(x.label));
    if(t){
      const over=c.daysSince - t.days;
      if(over > (DUE_WINDOW[t.k]||60))
        W.push(`${t.label} is past its capture window — it will be saved and flagged, not counted as on-time`);
      if(t.days>c.daysSince) W.push(`${t.label} is not due yet for this patient`);
    }
    if(st.primary==='') W.push('A registry timepoint was chosen but no PROM score entered');
  }
  return {problems:P, warnings:W};
}

/* wire the three buttons */
function addVisit(c){
  openModal({title:'Add visit', sub:'Captures the PROM set and, when imaging is performed, the radiographic measures for that visit.',
    build:()=>addVisitForm(c), saveLabel:'Save visit',
    onSave:v=>{
      const {problems}=validateVisit(c,v);
      if(problems.length){ toast('Not saved — '+problems[0]); return; }
      const tpk = TIMEPOINTS.find(t=>v.tp && v.tp.startsWith(t.label));
      if(tpk && v.primary!==''){
        c.proms[tpk.k] = {primary:+v.primary, axial:+v.axial||0, limb:+v.limb||0,
          eq5d:+v.eq5d||null, satisfied:/Very satisfied|Satisfied/.test(v.satisfied), workStatus:v.work||null};
      }
      if(tpk && v.imaging==='Yes'){
        const rom={}; Object.entries(v.rom).forEach(([l,x])=>{ if(x!=='') rom[l]=+x; });
        c.radio[tpk.k] = {rom, ho:+v.ho||0, asd:v.asd==='Symptomatic (ASD)',
          migration:v.device==='Migration', subsidence:v.device==='Subsidence'};
        if(v.asd==='Symptomatic (ASD)'){ c.asd=true; c.asdTp=c.asdTp||tpk.k; }
        if(+v.ho>c.hoGrade) c.hoGrade=+v.ho;
      }
      c.visitsExtra.push({date:v.date,type:v.type,notes:v.notes});
      logAudit(c,'Visit recorded', tpk? TP[tpk.k].label : v.type, '\u2014', 'entered');
      toast('Visit saved'+(tpk?' — '+tpk.label:''));
      go('case');
    }});
}
function addSurgery(c){
  openModal({title:'Add surgery', sub:'A secondary procedure is a registry event in its own right — it is the hard endpoint every analysis turns on.',
    build:()=>addSurgeryForm(c), saveLabel:'Save procedure',
    onSave:v=>{
      const cls = classify(v.levels);
      if(v.kind!=='Index procedure'){
        c.reop = {tp: (latestProm(c)||{k:'1y'}).k, reason: v.indication || v.kind};
      }
      c.procedures = c.procedures||[];
      c.procedures.push({...v, construct:cls, region:v.region});
      logAudit(c,'Procedure recorded', v.region+' '+v.kind, '\u2014', cls.type);
      toast('Procedure recorded — '+v.region+' · '+cls.type);
      go('case');
    }});
}
function addTest(c){
  openModal({title:'Add medical test', sub:'Imaging, physiology, laboratory and diagnostic procedures. Structured fields change with the test type.',
    build:()=>addTestForm(c), saveLabel:'Save test',
    onSave:v=>{
      if(!v.type){ toast('No test type selected'); return; }
      c.tests.push(v);
      logAudit(c,'Test recorded', v.type, '\u2014', v.date);
      toast(v.type+' recorded');
      go('case');
    }});
}

/* ------------------- searchable combo box -------------------
   Type to filter, arrow keys to move, Enter to pick. Options can carry a
   secondary label (a drug's class, say) so the picker teaches as it goes.
   ------------------------------------------------------------ */
function combo({placeholder, options, onPick, allowFree=true, value=''}){
  const wrap = el('div',{class:'cbox'});
  const input = el('input',{class:'inp',placeholder:placeholder||'Search…',value,
    autocomplete:'off',role:'combobox','aria-expanded':'false'});
  const pop = el('div',{class:'cpop',style:'display:none'});
  let idx=-1, shown=[];
  const norm = o => Array.isArray(o)? {v:o[0], s:o[1]} : {v:o, s:null};
  const render = ()=>{
    const q=input.value.trim().toLowerCase();
    shown = options.map(norm).filter(o=>!q || o.v.toLowerCase().includes(q) ||
      (o.s && o.s.toLowerCase().includes(q))).slice(0,60);
    pop.innerHTML='';
    if(!shown.length){
      pop.append(el('div',{class:'none'}, allowFree? 'No match — press Enter to add as free text' : 'No match'));
    } else {
      shown.forEach((o,i)=>pop.append(el('div',{role:'option','aria-selected':String(i===idx),
        onmousedown:e=>{e.preventDefault(); choose(o.v);}},
        el('span',{},o.v), o.s? el('small',{},o.s):null)));
    }
    pop.style.display='block';
    input.setAttribute('aria-expanded','true');
  };
  const hide = ()=>{ pop.style.display='none'; idx=-1; input.setAttribute('aria-expanded','false'); };
  const choose = v=>{ input.value=''; hide(); if(onPick) onPick(v); };
  input.addEventListener('focus',render);
  input.addEventListener('input',()=>{ idx=-1; render(); });
  input.addEventListener('blur',()=>setTimeout(hide,120));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(idx+1, shown.length-1); render(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(idx-1,0); render(); }
    else if(e.key==='Enter'){
      e.preventDefault();
      if(idx>=0 && shown[idx]) choose(shown[idx].v);
      else if(shown.length) choose(shown[0].v);          // a match always wins over free text
      else if(allowFree && input.value.trim()) choose(input.value.trim());
    } else if(e.key==='Escape'){ hide(); }
  });
  wrap.append(input, pop);
  return wrap;
}

function addAEForm(c){
  const st={type:'', onset:new Date().toISOString().slice(0,10), severity:'', serious:'No',
    related:'', action:'', outcome:'', resolved:'', reported:'No', narrative:''};
  const typeWrap = el('div',{});
  const draw=()=>{
    typeWrap.innerHTML='';
    typeWrap.append(
      el('label',{class:'f'}, el('span',{},'Event'),
        combo({placeholder:'Search adverse events— e.g. dysphagia, migration…',
          options:AE_TYPES, value:st.type,
          onPick:v=>{ st.type=v; draw(); }}),
        st.type? el('div',{class:'hint'},'Selected: '+st.type) : null));
  };
  draw();
  const node = el('div',{},
    el('div',{class:'subcard'},
      el('h5',{},'Event'),
      typeWrap,
      el('div',{class:'fgrid c3'},
        mField('Onset date',st,'onset',{type:'date'}),
        mSelect('Severity',st,'severity',AE_SEVERITY),
        mSelect('Serious (SAE)',st,'serious',['No','Yes'],{blank:false,
          hint:'Death, life-threatening, hospitalization, disability or reoperation'}))),
    el('div',{class:'subcard'},
      el('h5',{},'Assessment'),
      el('div',{class:'fgrid c3'},
        mSelect('Relatedness to device',st,'related',AE_RELATED),
        mSelect('Action taken',st,'action',AE_ACTION),
        mSelect('Outcome',st,'outcome',AE_OUTCOME)),
      el('div',{class:'fgrid c2'},
        mField('Resolution date',st,'resolved',{type:'date'}),
        mSelect('Reported to manufacturer / FDA',st,'reported',['No','Yes — MDR filed','Pending'],{blank:false,
          hint:'Device-related serious events may be reportable under 21 CFR 803'}))),
    mArea('Narrative',st,'narrative','What happened, when, and what was done…'));
  return {node, get:()=>({...st})};
}
function addAE(c){
  openModal({title:'Report adverse event',
    sub:'Safety reporting is what separates a registry from a spreadsheet — and device-related serious events may carry a regulatory reporting duty.',
    build:()=>addAEForm(c), saveLabel:'Save event',
    onSave:v=>{
      if(!v.type){ toast('No event type selected'); return; }
      c.aes = c.aes||[];
      c.aes.push(v);
      logAudit(c,'Adverse event reported', v.type, '\u2014', v.severity||'ungraded');
      toast('Adverse event recorded — '+v.type);
      go('case');
    }});
}

/* Record completeness: what the registry still needs from this case. Each
   gap links to the section that fills it. */
function completeness(c){
  const dueFu = TIMEPOINTS.filter(t=>t.k!=='pre' && t.days<=c.daysSince);
  const checks=[
    ['Identity & demographics', !!(c.name && c.dob && c.ethnicity && c.race), 's_top'],
    ['Contact detail', !!(c.phone && c.email && c.address), 's_top'],
    ['Consent & enrollment', !!(c.consent && c.consent.given && c.enrolled), 's_top'],
    ['Height & weight', !!(c.heightCm && c.weightKg), 's_top'],
    ['Comorbidities', !!(c.comorbidities && c.comorbidities.length), 's_history'],
    ['Substance use', !!c.substances, 's_history'],
    ['Medications', !!(c.meds && c.meds.length), 's_history'],
    ['Operative record', c.construct.indexLevels.length>0, 's_construct'],
    ['Implant UDI', c.construct.indexLevels.every(l=>!c.levels[l].device || c.levels[l].udi), 's_construct'],
    ['Baseline PROM', !!c.proms.pre, 's_prom'],
    ['Baseline imaging', !!c.radio.pre, 's_align'],
    ['Follow-up to date', dueFu.length? dueFu.every(t=>c.proms[t.k]) : true, 's_prom'],
  ];
  const done=checks.filter(x=>x[1]).length;
  return {checks, done, total:checks.length, pct:Math.round(100*done/checks.length)};
}

function ageFromDob(s){
  if(!s) return null;
  const d=new Date(s); if(isNaN(d)) return null;
  const now=new Date();
  let a=now.getFullYear()-d.getFullYear();
  const m=now.getMonth()-d.getMonth();
  if(m<0||(m===0&&now.getDate()<d.getDate())) a--;
  return a>=0&&a<120? a : null;
}
/* Required fields for a complete enrollment. Each entry: key, label, section,
   and optionally a test (defaults to "has a value") and a condition that
   decides whether the field applies at all. */
const ENROLL_REQ = [
  {key:'name',          label:'Full name',          sec:'Identity'},
  {key:'dob',           label:'Date of birth',      sec:'Identity'},
  {key:'sexAtBirth',    label:'Sex at birth',       sec:'Identity'},
  {key:'ethnicity',     label:'Ethnicity',          sec:'Demographics'},
  {key:'race',          label:'Race',               sec:'Demographics'},
  {key:'heightCm',      label:'Height',             sec:'Anthropometrics'},
  {key:'weightKg',      label:'Weight',             sec:'Anthropometrics'},
  {key:'phone',         label:'Phone',              sec:'Contact'},
  {key:'doctorInCharge',label:'Doctor in charge',   sec:'Care team'},
  {key:'consentSigned', label:'Signed consent',     sec:'Enrollment & consent', test:d=>d.consentSigned==='Yes'},
  {key:'trialName',     label:'Which clinical trial', sec:'Enrollment & consent', when:d=>d.trialYes==='Yes'},
  {key:'tobaccoStatus', label:'Tobacco status',     sec:'Substance use'},
  {key:'tobaccoPackYears', label:'Tobacco pack-years', sec:'Substance use', when:d=>['Current','Former'].includes(d.tobaccoStatus)},
  {key:'alcoholStatus', label:'Alcohol status',     sec:'Substance use'},
  {key:'cannabisStatus',label:'Cannabis status',    sec:'Substance use'},
  {key:'cannabisYears', label:'Years of cannabis use', sec:'Substance use', when:d=>d.cannabisStatus && d.cannabisStatus!=='Never'},
  {key:'dx',            label:'Diagnosis',          sec:'Presentation'},
  {key:'symptomMonths', label:'Symptom duration',   sec:'Presentation'},
  {key:'levels',        label:'At least one treated level', sec:'Operative record',
    test:d=>Object.values(d.levels).some(L=>L.tx!=='none')},
];
const DRAFT_KEY = 'mpsr_enroll_draft_v1';
function saveDraftLocal(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); return true; }catch(e){ return false; } }
function loadDraftLocal(){ try{ const s=localStorage.getItem(DRAFT_KEY); const d=s&&JSON.parse(s); return d&&d.region&&d.levels? d : null; }catch(e){ return null; } }
function clearDraftLocal(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

function enrollMissing(d){
  const out = ENROLL_REQ.filter(r=>!r.when || r.when(d))
    .filter(r=> r.test? !r.test(d) : !(d[r.key]!=null && String(d[r.key]).trim()!==''))
    .map(r=>({key:r.key, label:r.label, sec:r.sec}));
  /* every implant level needs its device */
  Object.entries(d.levels).forEach(([l,L])=>{
    if(L.tx!=='none' && deviceList(L.tx, d.region).length && !L.device)
      out.push({key:'dev_'+l, label:'Device at '+l, sec:'Operative record'});
  });
  return out;
}
function enrollRequiredCount(d){
  return ENROLL_REQ.filter(r=>!r.when || r.when(d)).length +
    Object.values(d.levels).filter(L=>L.tx!=='none' && deviceList(L.tx, d.region).length).length;
}
/* Same person already in the registry? Same date of birth plus the same last
   name, or the same full name in any word order. */
function findDuplicates(d){
  if(!d.name || !d.dob) return [];
  const toks = n => n.toLowerCase().replace(/,/g,' ').split(/\s+/).filter(Boolean);
  const mine = toks(d.name), myLast = mine[mine.length-1];
  return CASES.filter(c=>{
    if(!c.dob || !c.name) return false;
    if(c.dob.toISOString().slice(0,10)!==d.dob) return false;
    const t = toks(c.name);
    const sameSet = t.length===mine.length && t.every(x=>mine.includes(x));
    return sameSet || t.includes(myLast);
  });
}

        el('div',{class:'pcard'},

          el('div',{class:'subcard'},

          el('div',{class:'subcard',style:'margin-bottom:0'},
            H5('Other drugs'),

              sel('Status','otherDrugs',OTHER_DRUGS),

      el('div',{class:'mt'},
        el('div',{class:'pcard'},

                L('Started', el('input',{class:'inp',type:'month',value:m.start||'',

          el('button',{class:'addbtn',type:'button',

      el('div',{class:'pcard mt'},
        H('Presentation','presentation'),
        el('div',{class:'fgrid c3'},
          f('Diagnosis','dx',{ph:'e.g. Cervical DDD with radiculopathy'}),
          f('Symptom duration (months)','symptomMonths',{type:'number',ph:'18'}),
          sel('Prior surgery at the index level','priorSurgeryYN',['No','Yes'],false))),

      /* ---------------- construct ---------------- */
      el('div',{class:'sect mt'},
        (curSec='Operative record', el('h2',{id:'sec_operative'},'Operative record — construct builder')),
        el('p',{},'Record each level with its own treatment and implant. The registry classifies the construct, counts the preserved motion segments and flags the adjacent levels for surveillance.')),

      el('div',{class:'row',style:'margin-bottom:14px'},
        el('div',{class:'chips'}, ['Cervical','Lumbar'].map(r=>
          el('button',{class:'chip',type:'button','aria-pressed':String(draft.region===r),
            onclick:()=>{const keep={...draft}; draft=newDraft(r);
              Object.keys(keep).forEach(k=>{ if(k!=='region' && k!=='levels') draft[k]=keep[k]; });
              draw();}},r)))),

      el('div',{class:'grid g21'},
        el('div',{},
          el('div',{class:'levels f','data-key':'levels',id:'fld_levels',tabindex:'-1'},
            el('div',{class:'lvhead'}, el('div',{},'Level'), el('div',{},'Treatment'),
              el('div',{},'Device'), el('div',{},'UDI'), el('div',{})),
            rows),
          el('div',{class:'readout'},
            el('div',{class:'k'},'Derived construct'),
            el('div',{class:'cls'}, c.type),
            el('div',{class:'sig'}, c.signature),
            el('div',{class:'mini'},
              el('div',{}, el('div',{class:'mv'},c.mobile), el('div',{class:'ml'},'motion segments preserved')),
              el('div',{}, el('div',{class:'mv'},c.fused), el('div',{class:'ml'},'segments fused')),
              el('div',{}, el('div',{class:'mv'},c.indexLevels.length), el('div',{class:'ml'},'index levels')),
              el('div',{}, el('div',{class:'mv'},c.adjacent.length), el('div',{class:'ml'},'adjacent at risk')),
              el('div',{}, el('div',{class:'mv'},c.hybrid?'Yes':'No'), el('div',{class:'ml'},'hybrid construct')))),
          saveMsg,
          el('div',{class:'row',style:'margin-top:14px'},

            el('button',{class:'btn sec',type:'button',onclick:()=>{
              draft=newDraft(draft.region); showMiss=false; saveMsgOpen=false; clearDraftLocal(); draw();}},'Clear form'))),

        el('div',{},

    );
    derive();
    paintSaveMsg();
    updateStatus();
    requestAnimationFrame(()=>{ const tb=document.querySelector('.topbar');
      bar.style.top = (tb && getComputedStyle(tb).display!=='none'? tb.offsetHeight : 0)+'px'; });
  };

  function paintSaveMsg(){
    saveMsg.innerHTML='';
    const miss=enrollMissing(draft);
    if(!saveMsgOpen || !miss.length) return;
    saveMsg.append(el('div',{class:'banner crit',style:'margin-top:14px'},
      el('span',{html:ICON.alert}),
      el('div',{style:'flex:1'},
        el('b',{},`${miss.length} required field${miss.length===1?' is':'s are'} missing.`),
        ' They are outlined in red above. You can fill them in now, or save the case as incomplete and finish it later from the case record.',
        el('div',{class:'row',style:'margin-top:10px;gap:8px'},
          el('button',{class:'btn sm',type:'button',onclick:()=>jumpTo(miss[0].key)},'Go to first missing field'),
          el('button',{class:'btn sec sm',type:'button',onclick:()=>doSave()},'Save as incomplete')))));
  }

  async function doSave(){
    let liveId=null;
    if(LIVE){
      const {data,error}=await sb.rpc('next_case_id');
      if(error || !data){ toast('Could not get a case number — '+(error?error.message:'no access')); return; }
      liveId=data;
    }
    const i=ALL_CASES.length;
    const h=parseFloat(draft.heightCm)||null, w=parseFloat(draft.weightKg)||null;
    const nc = {
      id: liveId || 'MPSR-'+String(1000+i),
      name: draft.name || 'Unnamed patient',
      dob: draft.dob? new Date(draft.dob) : null,
      sex: draft.sexAtBirth==='Male'?'M':'F',
      heightCm:h, weightKg:w,
      ethnicity:draft.ethnicity||null, race:draft.race||null,
      education:draft.education||null, workType:draft.workType||null,
      consent:{given:draft.consentSigned==='Yes', version:'MPSR-ICF v1.2', date:new Date(),
        imaging:draft.consentImaging==='Yes', industryShare:draft.consentIndustry==='Yes', recontactYears:10},
      mrn:'•••'+ri(100,999), site:SITES[0], surgeon:draft.doctorInCharge||SURGEONS[0],
      age: ageFromDob(draft.dob) ?? ri(32,64),
      /* derived from the detailed answers, so there is one place to enter each fact */
      smoker: draft.tobaccoStatus==='Current',
      diabetes: draft.comorbidities.includes('Diabetes mellitus'),
      osteoporosis: draft.comorbidities.includes('Osteoporosis / osteopenia'), tScore:null,
      workersComp:false, litigation:false,
      preopOpioid: draft.meds.some(m=>m.cls==='Opioid'),
      symptomMonths: parseInt(draft.symptomMonths)||null,
      priorSurgery: draft.priorSurgeryYN==='Yes', dx:draft.dx||'Not specified',
      region:draft.region, levels:JSON.parse(JSON.stringify(draft.levels)),
      construct:classify(draft.levels), date:new Date(), daysSince:0,
      proms:{}, radio:{}, reop:null, responder:null, ankylosed:false, hoGrade:0,
      asd:false, asdTp:null, preRom:null, __new:true,
      sexAtBirth:draft.sexAtBirth||null, genderIdentity:draft.genderIdentity||null,
      phone:draft.phone||'', email:draft.email||'', address:draft.address||'',
      referrer:draft.referrer||'', enrolled:draft.enrolled!=='No',
      trial: draft.trialYes==='Yes'
        ? {participating:true, name:draft.trialName||'', nct:draft.trialNct||'', arm:draft.trialArm||''}
        : {participating:false},
      comorbidities:[...draft.comorbidities],
      substances:{
        tobacco:{status:draft.tobaccoStatus||null, packYears:parseFloat(draft.tobaccoPackYears)||null, years:parseFloat(draft.tobaccoYears)||null},
        alcohol:{status:draft.alcoholStatus||null, years:parseFloat(draft.alcoholYears)||null},
        cannabis:{status:draft.cannabisStatus||null, years:parseFloat(draft.cannabisYears)||null},
        other:{status:draft.otherDrugs||null, years:parseFloat(draft.otherDrugsYears)||null},
      },
      meds: draft.meds.filter(m=>m.agent||m.cls).map(m=>({agent:m.agent, cls:m.cls, dose:m.dose, unit:m.unit,
        route:m.route, freq:m.freq, start:m.start||'',
        months: m.start? Math.max(0, Math.round((Date.now()-new Date(m.start+'-01'))/(30.44*864e5))) : null})),
      tests:[], visitsExtra:[], aes:[], queries:[], audit:[],
      external:{linked:false, outsideEvents:[]},
    };
    logAudit(nc,'Created','record');
    ALL_CASES.push(nc); applyScope(); draft=null; clearDraftLocal();
    openCase(nc.id);
  }

  /* Enter moves to the next field, the way paper forms are filled */
  wrap.addEventListener('keydown', e=>{
    if(e.key!=='Enter' || e.shiftKey) return;
    const t=e.target;
    if(!(t.matches && t.matches('input.inp, select')) || t.closest('.cbox')) return;
    const all=[...wrap.querySelectorAll('input.inp:not([type=hidden]), select')]
      .filter(n=>!n.disabled && n.offsetParent && !n.closest('.enbar'));
    const i=all.indexOf(t);
    if(i>-1 && all[i+1]){ e.preventDefault(); all[i+1].focus(); }
  });

  draw();
  return wrap;
}

/* ====================== RADIOGRAPHIC / ROM ====================== */
let radioCaseId=null, radioTp='2y';
function renderRadio(){
  const cases = CASES.filter(c=>c.construct.mobile>0);
  radioCaseId = radioCaseId && cases.some(c=>c.id===radioCaseId) ? radioCaseId : (openCaseId && cases.some(c=>c.id===openCaseId)? openCaseId : cases[0].id);
  const c = CASES.find(x=>x.id===radioCaseId);
  const mobileLevels = c.construct.indexLevels.filter(l=>TX[c.levels[l].tx].motion!==false);
  const form = el('div',{});

  /* registry-level distributions */
  const hoCases = CASES.filter(c=>c.region==='Cervical'&&c.construct.family!=='fusion');
  const hoDist = [0,1,2,3,4].map(g=>({label:'Grade '+g,
    value:hoCases.filter(x=>x.hoGrade===g).length, unit:'Cases',
    color: g>=3? CSS('--s2') : CSS('--s1')}));
  const asdSeries = [{name:'Cumulative ASD',color:CSS('--s1'),
    points: RADIO_TPS.map(k=>{
      const elig=CASES.filter(x=>TP[k].days<=x.daysSince && x.construct.family!=='decomp');
      if(elig.length<5) return {y:null,n:elig.length};
      const n=elig.filter(x=>x.asd && TP[x.asdTp||'10y'].days<=TP[k].days).length;
      return {y:100*n/elig.length, n:elig.length};
    })}];

  const drawForm = ()=>{
    form.innerHTML='';
    const existing = c.radio[radioTp];
    form.append(
      el('div',{class:'grid g2',style:'gap:12px'},
        el('label',{class:'f'}, el('span',{},'Case'),
          el('select',{class:'inp',onchange:e=>{radioCaseId=e.target.value;go('radio');}},
            cases.map(x=>el('option',{value:x.id,selected:x.id===radioCaseId?'selected':null},
              `${x.id} — ${x.construct.type}`)))),
        el('label',{class:'f'}, el('span',{},'Timepoint'),
          el('select',{class:'inp',onchange:e=>{radioTp=e.target.value;drawForm();}},
            RADIO_TPS.filter(k=>k!=='pre').map(k=>el('option',{value:k,selected:k===radioTp?'selected':null},
              TP[k].label + (c.radio[k]?' — captured':(TP[k].days<=c.daysSince?' — outstanding':' — not yet due'))))))),
      el('h4',{style:'margin:6px 0 9px;font-size:12.5px'},'Segmental flexion-extension (degrees)'),
      el('div',{class:'grid',style:`grid-template-columns:repeat(${Math.min(4,Math.max(mobileLevels.length,1))},1fr);gap:10px`},
        mobileLevels.map(l=>el('label',{class:'f'},
          el('span',{},l+' — '+TX[c.levels[l].tx].short),
          el('input',{class:'inp',type:'number',step:'0.1',
            value: existing && existing.rom[l]!=null? existing.rom[l] : '',
            placeholder:'0.0'})))),
      el('div',{class:'grid g3',style:'gap:12px'},
        c.region==='Cervical'? el('label',{class:'f'}, el('span',{},'Heterotopic ossification — McAfee grade'),
          el('select',{class:'inp'}, [0,1,2,3,4].map(g=>
            el('option',{value:g,selected:existing&&existing.ho===g?'selected':null},
              `Grade ${g}${g===0?' — none':g>=3?' — motion restricting':''}`)))) : el('label',{class:'f'},
          el('span',{},'Facet / disc degeneration — Pfirrmann'),
          el('select',{class:'inp'},[1,2,3,4,5].map(g=>el('option',{value:g},'Grade '+g)))),
        el('label',{class:'f'}, el('span',{},'Adjacent segment degeneration'),
          el('select',{class:'inp'},
            ['None','Radiographic only','Symptomatic (ASD)'].map(o=>
              el('option',{value:o,selected:existing&&existing.asd&&o==='Symptomatic (ASD)'?'selected':null},o)))),
        el('label',{class:'f'}, el('span',{},'Device status'),
          el('select',{class:'inp'},
            ['Well seated','Subsidence','Migration','Screw loosening','Polyethylene wear','Device fracture'].map(o=>
              el('option',{value:o,selected:existing&&((existing.migration&&o==='Migration')||(existing.subsidence&&o==='Subsidence'))?'selected':null},o))))),
      el('div',{class:'row'},
        el('button',{class:'btn',type:'button',onclick:()=>toast('Radiographic timepoint saved (prototype — not persisted)')},'Save timepoint'),
        el('button',{class:'btn sec',type:'button',onclick:()=>openCase(c.id)},'Open case record'),
        el('div',{class:'spacer'}),
        existing? el('span',{class:'st good',html:ICON.check+'<span>Already captured at this timepoint</span>'})
                : el('span',{class:'st warn',html:ICON.clock+'<span>Outstanding</span>'}))
    );
  };
  drawForm();

  return el('div',{},
    el('div',{class:'sect'},
      el('h2',{},'Radiographic surveillance'),
      el('p',{},'Segmental motion, ossification, adjacent-level degeneration and device integrity on a 10-year schedule. This module is the reason the registry exists: no general spine registry captures any of it.')),
    card(null,null,form),
    el('div',{class:'grid g2 mt'},
      card('Heterotopic ossification distribution','Cervical motion-preservation cases, highest grade recorded. Grades III–IV are motion restricting.',
        barsH({bars:hoDist, labelW:88, width:460}),

          el('span',{}, el('b',{style:`background:${CSS('--s1')}`}),'Grade 0–II'),
          el('span',{}, el('b',{style:`background:${CSS('--s2')}`}),'Grade III–IV (motion restricting)'))),

  );
}

/* Quality of motion as a registry endpoint, not a per-patient curiosity. */
function corCohortCard(){
  const K = corCohort();
  /* a device with no still-mobile levels has no denominator, so no bar */
  const names = Object.keys(K.byTx).filter(n=>K.byTx[n].n-K.byTx[n].none>0)
    .sort((a,b)=>K.byTx[b].n-K.byTx[a].n);
  const bars = names.map(n=>{
    const b=K.byTx[n], meas=b.n-b.none;
    return {label:`${n} (n=${meas})`, value: meas? 100*b.disp/meas : 0, unit:'% of measurable levels',
            color: CSS('--s1')};
  });
  const tbl = el('table',{class:'tbl'});
  tbl.append(el('thead',{}, el('tr',{},
    el('th',{},'Axis at the treated level'), el('th',{class:'num'},'Cases'),
    el('th',{class:'num'},'\u0394 PROM'), el('th',{class:'num'},'MCID'))));
  const rows=[['Physiological',K.phys,'s1'],['Displaced',K.disp,'s2'],
              ['No measurable axis (<3\u00b0)',K.none,'s4']];
  const tb=el('tbody',{});
  rows.forEach(([lab,st,c])=>{
    tb.append(el('tr',{},
      el('td',{}, el('b',{style:`display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;background:${CSS('--'+c)}`}), lab),
      el('td',{class:'num'}, String(st.n)),
      el('td',{class:'num'}, st.d==null?'\u2014':fmt(st.d,1)),
      el('td',{class:'num'}, st.mcid==null?'\u2014':fmt(st.mcid,0)+'%')));
  });
  tbl.append(tb);
  return el('div',{class:'grid g2 mt'},
    card('Displaced axis of rotation, by device',
      'Share of still-mobile treated levels whose instantaneous axis falls outside the normative envelope for that level. Levels below the 3\u00b0 computability floor are excluded from the denominator and counted separately.',
      barsH({bars, labelW:132, width:460, scaleMax:100, valFmt:v=>fmt(v,0)+'%'}),
      el('p',{class:'note',style:'margin-top:10px'},
        'Range of motion says a level still moves. The axis says whether it moves the way a disc moves. A construct can hold 8\u00b0 and still track badly \u2014 that is the mechanism behind facet pain and late ossification, and it is invisible to every registry that records degrees alone.')),
    card('Axis quality against patient-reported outcome',
      'Cases grouped by the worst axis among their treated mobile levels, against change in the region-specific primary PROM from baseline to latest capture.',
      el('div',{class:'tscroll'}, tbl),
      el('p',{class:'note',style:'margin-top:10px'},
        'Points of improvement on NDI (cervical) or ODI (lumbar), baseline to latest capture; MCID is the share clearing 15 and 12.8 points respectively. Note the ordering the design can detect: a level that still moves but moves off-axis does worse than one that has stiffened into a de facto fusion. Synthetic data \u2014 these are the contrasts the registry would estimate, not findings.')));
}

/* ====================== PROMS / FOLLOW-UP ENGINE ====================== */
function renderProms(){
  const queue = dueNow();
  const missed = [];
  for(const c of CASES) for(const tp of TIMEPOINTS){
    if(tp.k==='pre') continue;
    if(fuStatus(c,tp.k)==='missed') missed.push({c,tp});
  }
  const matrixCases = [...CASES].sort((a,b)=>b.daysSince-a.daysSince).slice(0,16);
  const tps = TIMEPOINTS.filter(t=>t.k!=='pre');

  const matrix = el('table',{class:'tbl'});
  matrix.append(el('thead',{}, el('tr',{},
    el('th',{},'Case'), el('th',{},'Construct'),
    tps.map(t=>el('th',{class:'num'},t.label)))));
  const mb=el('tbody',{});
  matrixCases.forEach(c=>{
    mb.append(el('tr',{class:'clickable',onclick:()=>openCase(c.id)},
      el('td',{},c.id),
      el('td',{}, el('span',{class:'tag '+(c.construct.hybrid?'o':'b')},
        c.construct.region+' · '+(c.construct.hybrid?'hybrid':c.construct.family))),
      tps.map(t=>{
        const s=fuStatus(c,t.k);
        const col = s==='captured'?CSS('--good'):s==='due'?CSS('--warn'):s==='missed'?CSS('--crit'):CSS('--grid');
        return el('td',{class:'num'},
          el('span',{title:`${t.label}: ${s}`,
            style:`display:inline-block;width:11px;height:11px;border-radius:3px;background:${col}`}));
      })));
  });
  matrix.append(mb);

  const instruments = [
    ['ODI 2.1a','Lumbar function','Pre-op → 10 yr','Primary endpoint, lumbar'],
    ['NDI','Cervical function','Pre-op → 10 yr','Primary endpoint, cervical'],
    ['NRS back / neck','Axial pain 0–10','Pre-op → 10 yr','Co-primary'],
    ['NRS leg / arm','Limb pain 0–10','Pre-op → 10 yr','Co-primary'],
    ['EQ-5D-5L','Utility, health economics','Pre-op → 10 yr','Payer and HTA submissions'],
    ['PROMIS-10 Global','General health','Pre-op, 1 yr, 5 yr','ASR cross-comparability'],
    ['Return to work','Occupational outcome','6 mo → 10 yr','Employer and payer value case'],
    ['Satisfaction / would repeat','Patient experience','1 yr → 10 yr','Secondary'],
  ];

  return el('div',{},
    el('div',{class:'sect'},
      el('h2',{},'Patient-reported outcomes and the follow-up engine'),
      el('p',{},'Long-horizon capture is the registry’s hardest operational problem and its main scientific asset. Every timepoint has a window; anything inside the window is actionable, anything past it is recorded as missed rather than silently dropped.')),

    el('div',{class:'grid g4'},
      tile('Inside window now', String(queue.length), 'Actionable this week'),
      tile('Past window', String(missed.length), 'Recorded as missed, not dropped'),
      tile('5-year capture', `${fmt(fuRate('5y').rate,0)}<small>%</small>`, `${fuRate('5y').n}/${fuRate('5y').d} eligible`),
      tile('10-year capture', `${fmt(fuRate('10y').rate,0)}<small>%</small>`, `${fuRate('10y').n}/${fuRate('10y').d} eligible`)),

    el('div',{class:'mt'},
      card('Capture matrix','Most mature cases first. Green captured, amber inside window, red past window, gray not yet due.',
        el('div',{style:'overflow-x:auto'},matrix))),

    el('div',{class:'grid g21 mt'},
      card('Action queue','Ordered by days past target. In production each row fires an email/SMS sequence and a coordinator task.',
        tableEl([{label:'Case',key:'id'},{label:'Timepoint',key:'t'},{label:'Days past',key:'d',num:true,mono:true},
                 {label:'Contact',key:'c'},{label:'',key:'a'}],
          queue.slice(0,12).map(q=>({
            id:q.c.id, t:TP[q.tp.k].label, d:'+'+q.overdue,
            c: pick(['Email + SMS','Email','SMS','Portal + call']),
            a: el('button',{class:'btn sec sm',type:'button',
              onclick:ev=>{ev.stopPropagation();toast('Reminder queued for '+q.c.id);}},'Send'),
            __click:()=>openCase(q.c.id)

        tableEl([{label:'Instrument',key:'i'},{label:'Domain',key:'d'},{label:'Schedule',key:'s'}],
          instruments.map(([i,d,s])=>({i:el('strong',{},i),d,s}))))),

    el('div',{class:'mt'},
      card('Why the window matters',null,
        el('div',{class:'banner'},
          el('span',{html:ICON.info}),

let cq = {region:'all', family:'all', device:'all', minFu:'2y'};
function renderCohort(){
  const devices = [...new Set(CASES.flatMap(c=>c.construct.devices))].sort();
  const sel = CASES.filter(c=>{
    if(cq.region!=='all'&&c.region!==cq.region) return false;
    if(cq.family!=='all'&&c.construct.family!==cq.family) return false;
    if(cq.device!=='all'&&!c.construct.devices.includes(cq.device)) return false;
    if(cq.minFu!=='any'&&c.daysSince<TP[cq.minFu].days) return false;
    return true;
  });

  const withProm = sel.filter(c=>c.proms.pre && latestProm(c));
  const dPrimary = mean(withProm.map(c=>c.proms.pre.primary - latestProm(c).v.primary));
  const mcid = withProm.filter(c=>{
    const d=c.proms.pre.primary-latestProm(c).v.primary;
    return d>= MCID(c);
  }).length;
  const romCases = sel.filter(c=>c.construct.mobile>0).map(c=>{
    const lr=latestRadio(c); return lr? romAt(c,lr.k):null;}).filter(v=>v!=null);
  const stillMobile = romCases.filter(v=>v>=MOBILE_THRESHOLD).length;
  const hoHigh = sel.filter(c=>c.region==='Cervical'&&c.hoGrade>=3).length;
  const asdN = sel.filter(c=>c.asd).length;
  const reopN = sel.filter(c=>c.reop).length;
  const satN = withProm.filter(c=>latestProm(c).v.satisfied).length;

  const endpoints = [
    ['n in cohort', String(sel.length), 'Cases matching filters'],
    ['Mean improvement in '+(cq.region==='Lumbar'?'ODI':cq.region==='Cervical'?'NDI':'ODI / NDI'),
      dPrimary==null?'—':fmt(dPrimary,1)+' pts', 'Baseline minus latest available'],
    ['Reached MCID', withProm.length? `${pct(mcid,withProm.length)}% (${mcid}/${withProm.length})`:'—',
      'NDI \u2265 15 pts, ODI \u2265 12.8 pts'],
    ['Motion retained at latest X-ray', romCases.length? `${pct(stillMobile,romCases.length)}% (${stillMobile}/${romCases.length})`:'—',
      `Index level ≥ ${MOBILE_THRESHOLD}° flexion-extension`],
    ['Mean ROM at latest X-ray', romCases.length? fmt(mean(romCases),1)+'°':'—','Mobile index levels only'],
    ['Motion-restricting HO (III–IV)', `${hoHigh}`, 'Cervical cases only'],
    ['Symptomatic adjacent segment disease', sel.length? `${pct(asdN,sel.length)}% (${asdN})`:'—','Any timepoint'],
    ['Secondary surgical intervention', sel.length? `${pct(reopN,sel.length)}% (${reopN})`:'—','Revision, removal or supplemental fixation'],
    ['Satisfied at latest follow-up', withProm.length? `${pct(satN,withProm.length)}%`:'—','Would undergo again'],
  ];

  /* comparator: motion-preserving vs fusion arm within the same filter */
  const arms = [
    {name:'Motion preserving', color:CSS('--s1'), test:c=>c.construct.mobile>0&&!['fusion','decomp'].includes(c.construct.family)},
    {name:'Fusion comparator', color:CSS('--s2'), test:c=>c.construct.family==='fusion'},
  ];
  const cmpGroups=[{label:'Mean Δ primary PROM'},{label:'% reached MCID'},{label:'% reoperation'},{label:'% ASD'}];
  const armVals = arms.map(a=>{
    const s=sel.filter(a.test), wp=s.filter(c=>c.proms.pre&&latestProm(c));
    const d=mean(wp.map(c=>c.proms.pre.primary-latestProm(c).v.primary));
    const m=wp.filter(c=>(c.proms.pre.primary-latestProm(c).v.primary)>=MCID(c)).length;
    return {name:a.name,color:a.color,
      values:[d==null?null:d, wp.length?100*m/wp.length:null,
              s.length?100*s.filter(c=>c.reop).length/s.length:null,
              s.length?100*s.filter(c=>c.asd).length/s.length:null],
      notes:[`n=${wp.length}`,`n=${wp.length}`,`n=${s.length}`,`n=${s.length}`]};
  });

  return el('div',{},
    el('div',{class:'sect'},
      el('p',{},'The sponsor- and investigator-facing view. Slice by construct, device or follow-up maturity and read the endpoints that matter for coverage decisions and post-approval commitments.')),

    card('Filters',null,
      el('div',{class:'grid g4',style:'gap:12px'},
        el('label',{class:'f'}, el('span',{},'Region'),
          el('select',{class:'inp',onchange:e=>{cq.region=e.target.value;go('cohort');}},
            [['all','All'],['Cervical','Cervical'],['Lumbar','Lumbar']].map(([v,l])=>
              el('option',{value:v,selected:cq.region===v?'selected':null},l)))),
        el('label',{class:'f'}, el('span',{},'Construct family'),
          el('select',{class:'inp',onchange:e=>{cq.family=e.target.value;go('cohort');}},
            [['all','All'],['adr','ADR only'],['facet','Facet arthroplasty'],['hybrid','Hybrid'],
             ['multi_arthro','Combined arthroplasty'],['dynamic','Dynamic'],['fusion','Fusion comparator']].map(([v,l])=>
              el('option',{value:v,selected:cq.family===v?'selected':null},l)))),
        el('label',{class:'f'}, el('span',{},'Device'),
          el('select',{class:'inp',onchange:e=>{cq.device=e.target.value;go('cohort');}},
            [el('option',{value:'all',selected:cq.device==='all'?'selected':null},'Any device'),
             ...devices.map(d=>el('option',{value:d,selected:cq.device===d?'selected':null},d))])),
        el('label',{class:'f'}, el('span',{},'Minimum follow-up'),
          el('select',{class:'inp',onchange:e=>{cq.minFu=e.target.value;go('cohort');}},
            [['any','Any'],['1y','1 year'],['2y','2 years'],['3y','3 years'],['5y','5 years'],['7y','7 years']].map(([v,l])=>
              el('option',{value:v,selected:cq.minFu===v?'selected':null},l))))),
      el('div',{class:'row'},
        el('span',{class:'tag b'},`${sel.length} cases selected`),
        el('span',{class:'hint',style:'margin:0'},'Minimum follow-up filters on time since surgery, not on data captured — so the denominator stays honest.'),
        el('div',{class:'spacer'}),
        el('button',{class:'btn sec sm',type:'button',onclick:()=>toast('Export queued — CSV + data dictionary (prototype)')},'Export cohort'))),

    el('div',{class:'grid g21 mt'},
      card('Endpoints',null,
        tableEl([{label:'Endpoint',key:'e'},{label:'Value',key:'v',num:true},{label:'Definition',key:'d'}],
          endpoints.map(([e,v,d])=>({e:el('strong',{},e),v,d:el('span',{class:'hint',style:'margin:0'},d)})))),
      card('Construct mix in this cohort',null,
        barsH({bars:(()=>{const m=new Map();
          for(const c of sel) m.set(c.construct.type,(m.get(c.construct.type)||0)+1);
          return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([label,value])=>({label,value}));
        })(), labelW:248, width:520, maxLabel:38}))),

    el('div',{class:'mt'},
      card('Motion preserving vs fusion comparator','Within the current filter. Separate charts rather than a second axis — the units differ.',
        legendNode(armVals),
        el('div',{class:'grid',style:'grid-template-columns:0.62fr 1fr;gap:20px'},
          el('div',{},
            el('div',{class:'hint',style:'margin:0 0 6px'},'Mean improvement in primary PROM (points)'),
            barsV({groups:[{label:'Mean Δ ODI / NDI'}],
              series:armVals.map(a=>({name:a.name,color:a.color,values:[a.values[0]],notes:[a.notes[0]]})),
              yMax:Math.max(30,Math.ceil((Math.max(...armVals.map(a=>a.values[0]||0))+6))),
              height:210, width:300, valFmt:v=>fmt(v,0)})),
          el('div',{},
            el('div',{class:'hint',style:'margin:0 0 6px'},'Rates (%)'),
            barsV({groups:[{label:'MCID'},{label:'Reoperation'},{label:'ASD'}],
              series:armVals.map(a=>({name:a.name,color:a.color,values:a.values.slice(1),notes:a.notes.slice(1)})),
              yMax:100, height:210, width:470}))),
        el('p',{class:'hint',style:'margin-top:12px'},
          'With a real multi-site cohort this is the screen that answers the question the field has never answered at scale: does preserved segmental motion actually protect the adjacent segment, and in which constructs?')))
  );
}

      └ <b>implant</b>       level_treatment_id · device · manufacturer · <em>udi_di</em> · <em>udi_pi</em>

    ['Radiographic reading','Central, blinded, duplicate reads on a 10% sample with reported inter-reader agreement. Site-reported ROM alone is not credible to regulators or payers.'],
  ];
  const governance = [
    ['Regulatory posture','Observational registry under a single central IRB (commercial IRB) with site reliance agreements; 21 CFR Part 11 audit trail and e-signature from day one so the registry can later host FDA post-approval study obligations.'],
    ['Consent','eConsent with explicit re-contact permission out to 10 years and separate optional consent for imaging and for industry data sharing.'],
    ['Privacy','HIPAA limited data set for analysis; BAAs with each site; a one-way hashed enterprise identifier so a patient can be followed across sites without a shared MRN.'],
    ['Data ownership','The Institute of Neuro Innovation holds the dataset as the coordinating non-profit. Sponsors buy pre-specified analyses and pre-competitive access windows, never veto rights or exclusivity over the data.'],
    ['Publication policy','Writing committee appointed by the study group; sponsors see manuscripts for factual review on a fixed clock with no right to delay or suppress. Published up front — this is what makes the registry credible rather than marketing.'],
    ['Industry funding firewall','Multi-sponsor from the start, unrestricted grants to the Institute rather than to a practice, Sunshine Act reporting, and no sponsor-specific endpoint written into the core dataset.'],
  ];
  const build = [

    ['Phase 1 — single site, real data','REDCap or OpenClinica as the validated backend with this interface in front of it. REDCap is free to consortium members and credible with IRBs; OpenClinica community edition is built for 21 CFR Part 11. Either removes the compliance burden from the build.'],

          el('div',{html:`<b>A worked example from this group’s own practice.</b> The 360° artificial disc plus
            artificial facet replacement construct — reported by Ament, Petros, Gardner and Vokshoor in the
            <em>International Journal of Spine Surgery</em> for grade III spondylolisthesis — is a combined
            arthroplasty with no procedure code that describes it and no registry field that can hold it.
            In MPSR it classifies automatically, counts two preserved motion segments and puts the levels above
            and below under surveillance.`}))))
  );
}

/* ============================ landing ============================ */
const REDUCE = ()=>{ try{ return matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){ return false; } };
function countUp(node,to,fmtFn){
  const f = fmtFn || (v=>Math.round(v).toLocaleString('en-US'));
  if(REDUCE()){ node.textContent=f(to); return; }
  const dur=1500, t0=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    node.textContent=f(to*e);
    if(p<1) requestAnimationFrame(step);
  };

/* ===================== operations helpers ===================== */
function allQueries(){
  const out=[];
  CASES.forEach(c=>(c.queries||[]).forEach(q=>out.push({...q, case:c})));
  return out.sort((a,b)=> (a.status===b.status? (a.raised<b.raised?1:-1) : a.status==='Open'?-1:1));
}
function logAudit(c, action, field, from, to){
  c.audit = c.audit||[];
  c.audit.push({ts:new Date().toISOString().slice(0,16).replace('T',' '),
    user: currentUser.email || currentUser.name, action, field:field||'—', from:from||'—', to:to||'—'});
  liveQueue(c);
}
function linkageStats(){
  const linked=CASES.filter(c=>c.external && c.external.linked);
  const outside=CASES.filter(c=>c.external && c.external.outsideEvents.length);
  const inHouseReops=CASES.filter(c=>c.reop).length;
  const outsideReops=outside.filter(c=>/revision|fusion|decompression|removal/i.test(c.external.outsideEvents[0].type)).length;
  return {linked:linked.length, total:CASES.length, outside:outside.length,
    inHouseReops, outsideReops,
    sharePct: (inHouseReops+outsideReops)? Math.round(100*outsideReops/(inHouseReops+outsideReops)) : 0};
}
function siteStats(){
  return SITES.map(site=>{
    const cs=CASES.filter(c=>c.site===site);
    const cap=k=>{const e=cs.filter(c=>TP[k].days<=c.daysSince); const g=e.filter(c=>c.proms[k]);
      return e.length? Math.round(100*g.length/e.length) : null;};
    const wp=cs.filter(c=>c.proms.pre && latestProm(c));
    const d=mean(wp.map(c=>c.proms.pre.primary - latestProm(c).v.primary));
    const q=cs.reduce((n,c)=>n+(c.queries||[]).filter(x=>x.status==='Open').length,0);
    const linked=cs.filter(c=>c.external&&c.external.linked).length;
    return {site, n:cs.length, cap2:cap('2y'), cap5:cap('5y'), dPrim:d,
      openQ:q, qPer:cs.length? +(q/cs.length).toFixed(2):0,
      linkPct: cs.length? Math.round(100*linked/cs.length):0,
      aeRate: cs.length? Math.round(100*cs.filter(c=>c.reop||c.asd).length/cs.length):0};
  }).sort((a,b)=>b.n-a.n);
}

/* ================== DOSE-RESPONSE: motion vs outcome ==================
   The analysis the registry exists to run. Exposure is how much segmental
   motion the patient actually kept, integrated over time; outcome is the
   adjacent segment. Comparison is WITHIN the motion-preservation arm, which
   is what makes it immune to the selection-bias objection that has dogged
   every arthroplasty-versus-fusion comparison.
   ====================================================================== */
function motionYears(c){
  const ks = RADIO_TPS.filter(k=>c.radio[k] && romAt(c,k)!=null);
  if(ks.length<2) return null;
  let a=0;
  for(let i=0;i<ks.length-1;i++){
    const t1=TP[ks[i]].days/365, t2=TP[ks[i+1]].days/365;
    a += (romAt(c,ks[i])+romAt(c,ks[i+1]))/2*(t2-t1);
  }
  return +a.toFixed(1);                    /* degree-years */
}
function adjacentEventDay(c){
  const t=[];
  if(c.asd && c.asdTp) t.push(TP[c.asdTp].days);
  if(c.reop && /adjacent/i.test(c.reop.reason)) t.push(TP[c.reop.tp].days);
  ((c.external&&c.external.outsideEvents)||[]).forEach(e=>{
    if(/adjacent/i.test(e.type)) t.push((new Date(e.date)-c.date)/864e5);
  });
  return t.length? Math.min(...t) : null;
}
function doseCohort(){
  return CASES.filter(c=>c.construct.mobile>0 && !['fusion','decomp'].includes(c.construct.family))
    .map(c=>{
      const my=motionYears(c), lr=latestRadio(c);
      const retained = lr? romAt(c,lr.k) : null;
      const ev=adjacentEventDay(c);
      /* Cumulative motion-years is confounded by how long the patient was
         observed, so the primary exposure is the time-weighted average:
         motion-years divided by years of radiographic observation. */
      const obsYears = lr? TP[lr.k].days/365 : null;
      const avgRom = (my!=null && obsYears) ? +(my/obsYears).toFixed(2) : null;
      return {c, my, avgRom, obsYears, retained, eventDay:ev, followDay:c.daysSince};
    })
    .filter(x=>x.my!=null && x.retained!=null && x.avgRom!=null);
}
/* Kaplan-Meier, adjacent-event-free survival */
function km(rows, horizonDays){
  const pts=[{t:0,s:1,n:rows.length}];
  const times=[...new Set(rows.filter(r=>r.eventDay!=null).map(r=>r.eventDay))].sort((a,b)=>a-b);
  let S=1;
  times.forEach(t=>{
    if(t>horizonDays) return;
    const atRisk=rows.filter(r=>(r.eventDay??r.followDay)>=t).length;
    const d=rows.filter(r=>r.eventDay===t).length;
    if(atRisk>0){ S*= (1-d/atRisk); pts.push({t, s:S, n:atRisk}); }
  });
  pts.push({t:horizonDays, s:S, n:rows.filter(r=>(r.eventDay??r.followDay)>=horizonDays).length});
  return pts;
}
function renderDose(){
  const rows=doseCohort();
  /* Retained motion is bimodal — a level either keeps moving or stiffens — so a
     narrow 3–5° band holds only a handful of cases and its rate reads as noise
     beside bands ten times its size. Three bands keep every cell interpretable. */
  const BANDS=[['< 3°',0,3],['3–7°',3,7],['≥ 7°',7,99]];
  const banded=BANDS.map(([label,lo,hi])=>{
    const r=rows.filter(x=>x.retained>=lo && x.retained<hi);
    const ev=r.filter(x=>x.eventDay!=null).length;
    return {label, n:r.length, ev, rate: r.length? 100*ev/r.length : null};
  });
  /* tertiles of time-weighted average ROM, not cumulative motion-years */
  const sorted=[...rows].sort((a,b)=>a.avgRom-b.avgRom);
  const t1=sorted[Math.floor(sorted.length/3)], t2=sorted[Math.floor(2*sorted.length/3)];
  const cut1=t1?t1.avgRom:0, cut2=t2?t2.avgRom:0;
  const tertiles=[
    {name:`Low (≤ ${fmt(cut1,1)}° mean)`, rows:sorted.filter(r=>r.avgRom<=cut1), color:CSS('--s2')},
    {name:`Middle`, rows:sorted.filter(r=>r.avgRom>cut1&&r.avgRom<=cut2), color:CSS('--s4')},
    {name:`High (> ${fmt(cut2,1)}° mean)`, rows:sorted.filter(r=>r.avgRom>cut2), color:CSS('--s1')},
  ];
  const horizon=10*365;
  const xs=[0,1,2,3,5,7,10];
  const series=tertiles.map(t=>{
    const curve=km(t.rows,horizon);
    return {name:t.name, color:t.color,
      points: xs.map(y=>{
        const d=y*365;
        let s=1; curve.forEach(p=>{ if(p.t<=d) s=p.s; });
        return {y: 100*s, n:t.rows.length};
      })};
  });
  const overallEv=rows.filter(r=>r.eventDay!=null).length;
  const lowBand=banded[0], highBand=banded[banded.length-1];
  const rr = (lowBand.rate && highBand.rate!=null && highBand.rate>0)
    ? (lowBand.rate/highBand.rate) : null;

  return el('div',{},
    el('div',{class:'sect'},
      el('p',{html:'The registry’s reason to exist. Exposure is <b>motion-years preserved</b> — each patient’s segmental range of motion integrated over the years it was measured. Outcome is the adjacent segment. Both arms of the comparison are motion-preservation patients, so the usual objection that arthroplasty patients were healthier to begin with does not apply.'})),

    el('div',{class:'grid g4'},
      tile('Analyzable cases', String(rows.length), 'Motion-preserving, ≥ 2 radiographic timepoints'),
      tile('Mean retained motion', fmt(mean(rows.map(r=>r.avgRom)),1)+'<small>°</small>',
        'Time-weighted average across follow-up'),
      tile('Adjacent events', String(overallEv),
        rows.length? pct(overallEv,rows.length)+'% of the analyzable cohort':''),
      tile('Risk ratio, lowest vs highest band', rr? fmt(rr,1)+'×':'—',
        'Adjacent event rate, < 3° versus ≥ 7°', rr&&rr>1?'bad':'')),

/* ===================== STUDY PLANNER (power) ===================== */
/* Inverse normal CDF, Acklam's rational approximation. */
function zq(p){
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.3577518672690,-30.66479806614716,2.506628277459239];
  const b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572];
  const c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425;
  let q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function sampleSize(p1, p2, alpha, power, dropout){
  if(p1<=0||p1>=1||p2<=0||p2>=1||p1===p2) return null;
  const za=zq(1-alpha/2), zb=zq(power), pbar=(p1+p2)/2;
  const n = Math.pow(za*Math.sqrt(2*pbar*(1-pbar)) + zb*Math.sqrt(p1*(1-p1)+p2*(1-p2)), 2)/Math.pow(p1-p2,2);
  const perGroup = Math.ceil(n/(1-dropout));
  return {perGroup, total:perGroup*2};
}
let planner = {p1:25, rrr:50, alpha:5, power:80, dropout:25, rate:9, fu:5};
function renderPlanner(){
  const P=planner;
  /* Results repaint in place. Re-rendering the screen on each keystroke would
     rebuild the field being typed into and close the keyboard on a phone. */
  const outWrap=el('div',{class:'grid',style:'grid-template-columns:1fr;gap:13px'});
  const sensWrap=el('div',{});
  const sensNote=el('div',{class:'hint',style:'margin-top:10px'});
  const f=(label,key,opts={})=>el('label',{class:'f'},
    el('span',{},label),
    el('input',{class:'inp',type:'number',inputmode:'decimal',step:opts.step||'1',value:P[key],
      oninput:e=>{
        const raw=e.target.value;
        if(raw===''||raw==='.'||raw==='-'||raw==='-.') return;
        const v=parseFloat(raw);
        if(!isFinite(v)) return;
        P[key]=v; paint();
      },
      onblur:e=>{
        let v=parseFloat(e.target.value);
        if(!isFinite(v)) v=opts.fallback!=null?opts.fallback:0;
        if(opts.min!=null) v=Math.max(opts.min,v);
        if(opts.max!=null) v=Math.min(opts.max,v);
        e.target.value=v; P[key]=v; paint();
      }}),
    opts.hint? el('div',{class:'hint'},opts.hint):null);

  const paint=()=>{
    const p1=P.p1/100, p2=p1*(1-P.rrr/100);
    const res=sampleSize(p1,p2,P.alpha/100,P.power/100,P.dropout/100);
    const months = res? Math.ceil(res.total/Math.max(P.rate,0.1)) : null;
    const toAnswer = months!=null? months + P.fu*12 : null;
    const sens=[20,30,40,50,60,70].map(r=>{
      const q=sampleSize(p1, p1*(1-r/100), P.alpha/100, P.power/100, P.dropout/100);
      return {r, n:q?q.total:null};
    });
    outWrap.innerHTML='';
    outWrap.append(
      tile('Cases required', res? String(res.total):'\u2014',
        res? `${res.perGroup} per group, after ${P.dropout}% attrition`:'Check the inputs'),
      tile('Enrollment period', months!=null? months+'<small> months</small>':'\u2014',
        months!=null? `at ${P.rate} cases/month`:''),
      tile('Time to the answer', toAnswer!=null? (toAnswer/12).toFixed(1)+'<small> years</small>':'\u2014',
        toAnswer!=null? `enrollment plus ${P.fu}-year follow-up`:''));
    sensWrap.innerHTML='';
    sensWrap.append(barsH({bars:sens.map(x=>({label:x.r+'% reduction', value:x.n||0, unit:'Cases'})),
      labelW:132, width:560, valFmt:v=>String(v)}));
    sensNote.textContent =
      `At the current assumptions, detecting a ${P.rrr}% reduction needs ${res?res.total:'\u2014'} cases. Halving the effect roughly quadruples the sample.`;
  };
  paint();

  return el('div',{},
    el('div',{class:'sect'},
      el('p',{},'The first question a sponsor asks is how many patients, for how long, and when the answer arrives. This sizes the primary endpoint — adjacent-level reoperation — and converts it into a calendar.')),

    el('div',{class:'grid g21'},
      card('Assumptions','Change any input; everything below recomputes.',
        el('div',{class:'fgrid c2'},
          f('Event rate, low-motion group (%)','p1',{min:0.1,max:99,fallback:25,hint:'Adjacent-level event by the follow-up horizon'}),
          f('Relative reduction to detect (%)','rrr',{min:1,max:99,fallback:50,hint:'In the high-motion group'})),
        el('div',{class:'fgrid c3'},
          f('Alpha (%)','alpha',{min:0.1,max:20,fallback:5}),
          f('Power (%)','power',{min:50,max:99,fallback:80}),
          f('Loss to follow-up (%)','dropout',{min:0,max:90,fallback:25,hint:'Inflates the sample'})),
        el('div',{class:'fgrid c2'},
          f('Enrollment (cases/month)','rate',{step:'0.5',min:0.5,max:200,fallback:9}),
          f('Follow-up horizon (years)','fu',{min:1,max:20,fallback:5})),
        el('div',{class:'hint',style:'margin-top:4px'},
          'Two-sided test of two independent proportions, 1:1 allocation, with the sample inflated for attrition.')),

      el('div',{}, outWrap)),

    el('div',{class:'mt'},
      card('How the sample grows as the effect shrinks',
        'The practical message: a registry powered only for a large effect cannot rule out a small one.',
        sensWrap, sensNote)),

    el('div',{class:'mt'},
      card('Reading this honestly',null,
        el('div',{class:'banner warn'},
          el('span',{html:ICON.alert}),
          el('div',{html:'<b>Illustrative only.</b> The default event rate is drawn from this prototype’s synthetic cohort, not from real data. Before any of these numbers reach a sponsor they must be re-derived from published rates or from the registry’s own pilot, and the primary analysis should be a time-to-event model rather than a comparison of proportions — which usually needs fewer patients than shown here.'}))))
  );
}

/* ===================== RISK CALCULATOR =====================
   A transparent additive model on the log-odds scale. Every weight is shown
   and every contribution is displayed, because a calculator a surgeon cannot
   interrogate is one they are right not to trust.
   =========================================================== */
const RISK_MODEL = {
  mcid:   {intercept: 1.35, label:'Reaches MCID in PROM at 1 year'},
  motion: {intercept: 1.05, label:'Retains ≥ 3° at the index level at 5 years'},
  adjacent:{intercept:-2.30, label:'Adjacent-level event by 5 years'},
  weights: [
    {k:'age',    label:'Age',                   f:v=>(v-50)/10,  w:{mcid:-0.14, motion:-0.22, adjacent: 0.26}, unit:'per 10 yrs over 50'},
    {k:'bmi',    label:'BMI',                   f:v=>(v-26)/5,   w:{mcid:-0.18, motion:-0.10, adjacent: 0.17}, unit:'per 5 over 26'},
    {k:'smoker', label:'Current smoker',        f:v=>v?1:0,      w:{mcid:-0.42, motion:-0.30, adjacent: 0.38}, unit:''},
    {k:'diabetes',label:'Diabetes',             f:v=>v?1:0,      w:{mcid:-0.25, motion:-0.12, adjacent: 0.20}, unit:''},
    {k:'tscore', label:'DEXA T-score',          f:v=>Math.min(0,(v+1.0)), w:{mcid:-0.05, motion:-0.28, adjacent:0.22}, unit:'below −1.0'},
    {k:'basePrim',label:'Baseline disability',  f:v=>(v-45)/10,  w:{mcid: 0.30, motion: 0.00, adjacent: 0.06}, unit:'per 10 pts over 45'},
    {k:'durMo',  label:'Symptom duration',      f:v=>(v-12)/12,  w:{mcid:-0.16, motion:-0.05, adjacent: 0.08}, unit:'per yr over 1'},
    {k:'levels', label:'Index levels',          f:v=>(v-1),      w:{mcid:-0.12, motion:-0.26, adjacent: 0.30}, unit:'per level over 1'},
    {k:'hybrid', label:'Hybrid with fusion',    f:v=>v?1:0,      w:{mcid:-0.05, motion:-0.18, adjacent: 0.34}, unit:''},
    {k:'adjPfirr',label:'Adjacent-level Pfirrmann', f:v=>(v-2),  w:{mcid:-0.06, motion:-0.08, adjacent: 0.42}, unit:'per grade over 2'},
    {k:'comp',   label:'Workers’ compensation', f:v=>v?1:0, w:{mcid:-0.55, motion: 0.00, adjacent: 0.10}, unit:''},
    {k:'opioid', label:'Baseline opioid use',   f:v=>v?1:0,      w:{mcid:-0.38, motion: 0.00, adjacent: 0.12}, unit:''},
  ],
};
const sigmoid = z => 1/(1+Math.exp(-z));
function riskPredict(inp){
  const out={};
  ['mcid','motion','adjacent'].forEach(k=>{
    let z=RISK_MODEL[k].intercept;
    const parts=[];
    RISK_MODEL.weights.forEach(w=>{
      const x=w.f(inp[w.k]), c=x*w.w[k];
      if(Math.abs(c)>0.001) parts.push({label:w.label, c});
      z+=c;
    });
    out[k]={p:sigmoid(z), z, parts:parts.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c))};
  });
  return out;
}

        el('div',{style:'margin-top:12px'},

/* ======================= REPORTS & EXPORT =======================
   Publication-ready tables and a de-identified analysis dataset.
   Site accounts export their own site; INI accounts choose any site or all. */
const FAMILY_LABEL = {adr:'Disc replacement', hybrid:'Hybrid', facet:'Facet arthroplasty',
  multi_arthro:'Disc + facet replacement', dynamic:'Dynamic stabilization', fusion:'Fusion (comparator)', decomp:'Decompression'};
const EXPORT_LOG = [];
let rpt = {site:'all', region:'all', compare:'mp_fusion', minFu:'0'};

const sd = a => { if(a.length<2) return null; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1)); };
const median = a => { if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), h=Math.floor(b.length/2); return b.length%2? b[h] : (b[h-1]+b[h])/2; };
function smdCont(a,b){ const s1=sd(a), s2=sd(b); if(s1==null||s2==null) return null;
  const p=Math.sqrt((s1*s1+s2*s2)/2); return p? (mean(a)-mean(b))/p : 0; }
function smdBin(p1,p2){ const v=(p1*(1-p1)+p2*(1-p2))/2; return v? (p1-p2)/Math.sqrt(v) : 0; }

const isMotion = c => !['fusion','decomp'].includes(c.construct.family);
const currentCannabis = c => ['Occasional','Weekly','Daily'].includes(c.substances&&c.substances.cannabis&&c.substances.cannabis.status);
const glp1 = c => (c.meds||[]).some(m=>m.cls==='GLP-1 receptor agonist');
const deltaProm = c => { const l=latestProm(c); return c.proms.pre && l? c.proms.pre.primary - l.v.primary : null; };

function reportCohort(){
  const base = rpt.site==='all'? CASES : CASES.filter(c=>c.site===rpt.site);
  const reg = rpt.region==='all'? base : base.filter(c=>c.region===rpt.region);
  const fu = reg.filter(c=>c.daysSince >= +rpt.minFu);
  return {base, reg, fu};
}
function reportGroups(cs){
  if(rpt.compare==='none') return [{name:'Whole cohort', cases:cs}];
  if(rpt.compare==='mp_fusion') return [
    {name:'Motion preservation', cases:cs.filter(isMotion)},
    {name:'Fusion', cases:cs.filter(c=>c.construct.family==='fusion')}];
  const fams = [...new Set(cs.map(c=>c.construct.family))];
  const order = ['adr','hybrid','facet','multi_arthro','dynamic','fusion','decomp'];
  return fams.sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(f=>({name:FAMILY_LABEL[f]||f, cases:cs.filter(c=>c.construct.family===f)}));
}

const T1_ROWS = [
  {label:'Age, years', t:'c', f:c=>c.age},
  {label:'Female', t:'b', f:c=>c.sex==='F'},
  {label:'BMI, kg/m²', t:'c', f:c=>bmiFrom(c.heightCm,c.weightKg)},
  {label:'Cervical', t:'b', f:c=>c.region==='Cervical'},
  {label:'Index levels', t:'c', f:c=>c.construct.indexLevels.length},
  {label:'Current smoker', t:'b', f:c=>c.smoker || (c.substances&&c.substances.tobacco.status==='Current')},
  {label:'Current cannabis use', t:'b', f:currentCannabis},
  {label:'Diabetes', t:'b', f:c=>!!c.diabetes},
  {label:'GLP-1 receptor agonist', t:'b', f:glp1},
  {label:"Workers' compensation", t:'b', f:c=>!!c.workersComp},
  {label:'Opioid use at baseline', t:'b', f:c=>!!c.preopOpioid},

  {label:'Baseline NDI / ODI (0–100)', t:'c', f:c=>c.proms.pre? c.proms.pre.primary : null},
];
const T2_ROWS = [
  {label:'Follow-up, years (median)', t:'m', f:c=>c.daysSince/365},
  {label:'Change in NDI / ODI, points', t:'c', f:deltaProm},
  {label:'Reached MCID', t:'b', f:c=>{ const d=deltaProm(c); return d==null? null : d>=MCID(c); }},
  {label:'Reoperation', t:'b', f:c=>!!c.reop},
  {label:'Adjacent segment disease', t:'b', f:c=>!!c.asd},
  {label:'Heterotopic ossification grade III–IV', t:'b', f:c=>isMotion(c)&&c.region==='Cervical'? c.hoGrade>=3 : null},
  {label:'Still mobile at latest X-ray (≥3°)', t:'b', f:c=>{ if(!isMotion(c)) return null; const lr=latestRadio(c); const v=lr&&romAt(c,lr.k); return v==null? null : v>=MOBILE_THRESHOLD; }},
  {label:'Adverse event, any', t:'b', f:c=>(c.aes||[]).length>0},
];
/* one table: rows × groups, plus SMD when exactly two groups */
function buildTable(rows, groups){
  const two = groups.length===2;
  const head = ['Characteristic', ...groups.map(g=>`${g.name} (n=${g.cases.length})`), ...(two? ['SMD'] : [])];
  const body = rows.map(r=>{
    const cells=[r.label];
    const stats = groups.map(g=>{
      const vals = g.cases.map(r.f).filter(v=>v!=null && !(typeof v==='number' && isNaN(v)));
      if(r.t==='b'){ const n=vals.filter(Boolean).length; return {txt: vals.length? `${n} (${fmt(100*n/vals.length,1)}%)` : '—', p: vals.length? n/vals.length : null}; }
      if(r.t==='m'){ const m=median(vals); return {txt: m==null? '—' : fmt(m,1), vals}; }
      const m=mean(vals), s=sd(vals);
      return {txt: m==null? '—' : `${fmt(m,1)} (${s==null?'—':fmt(s,1)})`, vals};
    });
    cells.push(...stats.map(x=>x.txt));
    if(two){
      let d=null;
      if(r.t==='b' && stats[0].p!=null && stats[1].p!=null) d=smdBin(stats[0].p, stats[1].p);
      else if(r.t==='c' && stats[0].vals.length>1 && stats[1].vals.length>1) d=smdCont(stats[0].vals, stats[1].vals);
      cells.push(d==null? '—' : fmt(Math.abs(d),2));
    }
    return cells;
  });
  return {head, body};
}
const csvCell = v => { const s=String(v??''); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
const toCSV = (head, body) => [head, ...body].map(r=>r.map(csvCell).join(',')).join('\n');
const toTSV = (head, body) => [head, ...body].map(r=>r.join('\t')).join('\n');
function downloadText(name, text, mime='text/csv'){
  try{
    const blob=new Blob(['﻿'+text],{type:mime+';charset=utf-8'});
    const a=el('a',{href:URL.createObjectURL(blob),download:name});
    document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
    return true;
  }catch(e){ return false; }
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const t=el('textarea',{style:'position:fixed;opacity:0'}); t.value=text; document.body.append(t); t.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} t.remove(); return ok;
  }
}

function datasetRows(cs){
  return cs.map((c,i)=>{
    const l=latestProm(c), lr=latestRadio(c), rv=lr? romAt(c,lr.k) : null, d=deltaProm(c);
    const bmi=bmiFrom(c.heightCm,c.weightKg);
    return [i+1, String.fromCharCode(65+ALL_SITES.indexOf(c.site)), c.region, c.construct.family, c.construct.type,
      c.construct.indexLevels.length, c.construct.hybrid?1:0, Math.min(90,c.age), c.sex, bmi??'',
      c.substances? c.substances.tobacco.status||'' : '', c.substances? c.substances.cannabis.status||'' : '',
      c.diabetes?1:0, glp1(c)?1:0, c.preopOpioid?1:0, c.workersComp?1:0, c.symptomMonths??'',
      c.proms.pre? c.proms.pre.primary : '', l? l.v.primary : '', l? TP[l.k].label : '',
      d==null? '' : fmt(d,1), d==null? '' : (d>=MCID(c)?1:0), c.daysSince,
      c.reop?1:0, c.reop? TP[c.reop.tp].label : '', c.asd?1:0, c.hoGrade??'', c.ankylosed?1:0,
      rv==null? '' : fmt(rv,1), (c.aes||[]).length];
  });
}
