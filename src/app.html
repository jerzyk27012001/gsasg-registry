<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPSR — Motion Preservation Spine Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ tokens ============================ */
:root{
  color-scheme: light;
  /* Institute of Neuro Innovation palette: ground #081923, mint #3FD7A7, cyan #44AFBE */
  --page:#f2f6f5; --surface:#fbfdfc; --surface-2:#ffffff;
  --ink:#06181f; --ink-2:#41565c; --muted:#7a9093;
  --grid:#dee8e7; --baseline:#bfcecd; --border:rgba(6,24,31,0.12);
  --s1:#11936f; --s2:#c85a22; --s3:#2a7cb5; --s4:#956f08;
  --good:#11936f; --warn:#b07d06; --serious:#c85a22; --crit:#c23b33;
  --ok-text:#0a6b50;
  --mint:#0e8f6b; --cyan:#2e8c9e; --ini:#081923;
  --nav:#081923; --nav-ink:#e6f0ef; --nav-muted:#7e9a9c;
  --r:8px; --r-sm:5px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#081923; --surface:#0d222d; --surface-2:#122a35;
  --ink:#eaf3f2; --ink-2:#a9c2c3; --muted:#7a9699;
  --grid:#16303b; --baseline:#24424e; --border:rgba(255,255,255,0.10);
  --s1:#1aa07a; --s2:#d9622e; --s3:#4192cc; --s4:#ad800e;
  --good:#1aa07a; --warn:#c9950f; --serious:#d9622e; --crit:#d9534a;
  --ok-text:#35c79b;
  --mint:#3fd7a7; --cyan:#44afbe; --ini:#081923;
  --nav:#050f16; --nav-ink:#e6f0ef; --nav-muted:#7e9a9c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font:14px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Lora",Georgia,"Times New Roman",serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
a{color:var(--s1)}

/* ============================ shell ============================ */
.app{display:flex;min-height:100vh}
.nav{
  width:216px;flex:0 0 216px;background:var(--nav);color:var(--nav-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;
  overflow:hidden;
}
.brand{flex:0 0 auto}
/* the item list is the only part that scrolls — brand and footer stay put */
#navlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px}
#navlist::-webkit-scrollbar{width:7px}
#navlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
#navlist::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
#navlist{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .glyph{flex:0 0 auto;display:flex;align-items:center}
.brand .name{font-size:15px;font-weight:650;letter-spacing:.02em;display:flex;align-items:baseline;gap:5px}
.brand .sub b{font-family:"Lora",Georgia,serif;letter-spacing:.03em;text-transform:none;font-size:11px}
.brand .by{font-size:10.5px;font-weight:500;color:var(--nav-muted);letter-spacing:.06em;font-family:"Lora",Georgia,serif}
.brand .sub{color:var(--nav-muted);font-size:10px;margin-top:6px;letter-spacing:.045em;text-transform:uppercase;line-height:1.45}
.brand .sub b{color:var(--mint);font-weight:600}
.navgroup{padding:14px 10px 2px;color:var(--nav-muted);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:8px 12px;margin:1px 6px;border-radius:var(--r-sm);
  color:var(--nav-muted);cursor:pointer;font-size:13.5px;
}
.navitem:hover{background:rgba(255,255,255,.055);color:var(--nav-ink)}
.navitem[aria-current="true"]{background:rgba(255,255,255,.1);color:#fff;font-weight:550}
.navitem svg{width:16px;height:16px;flex:0 0 16px;opacity:.9}
.navitem .pill{margin-left:auto;background:var(--crit);color:#fff;font-size:10.5px;
  font-weight:600;padding:1px 6px;border-radius:9px;line-height:1.45}
.navfoot{flex:0 0 auto;margin-top:0;padding:12px;border-top:1px solid rgba(255,255,255,.08);
  color:var(--nav-muted);font-size:11px}
.navfoot button{background:none;border:1px solid rgba(255,255,255,.16);color:var(--nav-muted);
  border-radius:var(--r-sm);padding:5px 9px;cursor:pointer;width:100%;font-size:11.5px}
.navfoot button:hover{color:var(--nav-ink);border-color:rgba(255,255,255,.3)}
.navfoot .who{margin-bottom:10px;line-height:1.45}
.navfoot .who b{display:block;color:var(--nav-ink);font-size:12.5px}
.navfoot .who .sc{display:inline-block;margin-top:5px;padding:1px 8px;border-radius:9px;font-size:10.5px;
  border:1px solid rgba(63,215,167,.45);color:#3fd7a7}
.navfoot .who .sc.site{border-color:rgba(255,255,255,.25);color:var(--nav-muted)}
.navfoot .footbtns{display:grid;grid-template-columns:1fr;gap:6px}
.scopechip{font-size:11.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--border);color:var(--ink-2);white-space:nowrap}
.scopechip b{color:var(--ink)}
@media(max-width:700px){.scopechip{display:none}}
.pubt td,.pubt th{white-space:nowrap}
.pubt td:first-child{white-space:normal;min-width:190px}
.methods{font-family:"Lora",Georgia,serif;font-size:14px;line-height:1.7;color:var(--ink);background:var(--page);
  border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.savechip{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--border);
  background:none;color:var(--s1);white-space:nowrap;cursor:default}
.savechip.err{color:var(--crit);border-color:var(--crit);cursor:pointer}
body.signedout .nav, body.signedout .topbar, body.signedout .burger{display:none !important}
body.signedout #content{max-width:none}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.authcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 24px}
.authcard h2{font-size:20px;margin:0 0 14px}
.authcard form .btn{width:100%;margin-top:6px;justify-content:center}
.authhead{display:flex;gap:12px;align-items:center;margin-bottom:22px;color:var(--ink)}
.authhead .t1{font-weight:700;font-size:17px}
.authhead .t2{font-size:11.5px;color:var(--muted);margin-top:2px}
.linkbtn{background:none;border:none;color:var(--s1);font:inherit;font-size:13px;cursor:pointer;padding:12px 0 0;display:block}
.userlist{display:grid;gap:10px}
.userrow{display:grid;grid-template-columns:1.6fr 1fr 1.2fr auto;gap:10px;align-items:center}
.userrow>*{min-width:0}
@media(max-width:760px){.userrow{grid-template-columns:1fr 1fr}.userrow>:first-child{grid-column:1/-1}}
.acctgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.acct{text-align:left;font:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:15px 16px;color:var(--ink)}
.acct:hover{border-color:var(--s1)}
.acct[aria-current="true"]{border-color:var(--s1);box-shadow:0 0 0 2px color-mix(in srgb,var(--s1) 25%,transparent)}
.acct .nm{font-weight:650;font-size:14px}
.acct .rl{color:var(--ink-2);font-size:12.5px;margin-top:3px}
.acct .sc{display:inline-block;margin-top:9px;font-size:11px;padding:2px 9px;border-radius:9px;
  background:color-mix(in srgb,var(--s1) 13%,transparent);color:var(--s1)}
.acct .sc.site{background:var(--page);color:var(--ink-2);border:1px solid var(--border)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;
  border-bottom:1px solid var(--border);background:var(--surface);
  position:sticky;top:0;z-index:30;
}
.topbar h1{font-size:17px}
.topbar .crumb{color:var(--muted);font-size:12px;margin-top:2px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.proto{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:var(--ink-2);background:var(--page);border:1px solid var(--border);
  padding:4px 9px;border-radius:20px;letter-spacing:.02em;
}
.proto i{width:6px;height:6px;border-radius:50%;background:var(--warn);display:block}
.content{padding:22px 26px 56px;max-width:1180px}
.screen{display:none}
.screen.on{display:block}

/* ============================ primitives ============================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);}
.card>header{padding:14px 16px 0}
.card>header h3{font-size:14px}
.card>header p{margin:4px 0 0;color:var(--muted);font-size:12px}
.card>.body{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.6fr 1fr}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g21{grid-template-columns:1fr}}
.sect{margin:0 0 14px}
.sect h2{font-size:15px}
.sect p{margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:72ch}
.mt{margin-top:18px}

.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px}
.tile .lab{color:var(--muted);font-size:11.5px;letter-spacing:.02em;text-transform:uppercase}
.tile .val{font-size:26px;font-weight:620;letter-spacing:-0.02em;margin-top:5px;line-height:1.1}
.tile .val small{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.tile .note{margin-top:5px;font-size:11.5px;color:var(--ink-2)}
.tile .note.good{color:var(--ok-text)}
.tile .note.bad{color:var(--crit)}

.btn{
  background:var(--s1);color:#fff;border:1px solid transparent;border-radius:var(--r-sm);
  padding:7px 13px;cursor:pointer;font-weight:550;font-size:13px;
}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--border)}
.btn.sec:hover{background:var(--page);filter:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.inp,select.inp,textarea.inp{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:7px 9px;font-size:13.5px;
}
.inp:focus{outline:2px solid var(--s1);outline-offset:-1px;border-color:transparent}
.hint{color:var(--muted);font-size:11.5px;margin-top:4px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:0 10px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--page)}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td.mono{font-variant-numeric:tabular-nums;font-size:12.5px}

.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;
  padding:2px 8px;border-radius:20px;border:1px solid var(--border);
  background:var(--page);color:var(--ink-2);white-space:nowrap;
}
.tag.b{background:color-mix(in srgb,var(--s1) 13%,transparent);border-color:color-mix(in srgb,var(--s1) 32%,transparent);color:var(--s1)}
.tag.o{background:color-mix(in srgb,var(--s2) 14%,transparent);border-color:color-mix(in srgb,var(--s2) 34%,transparent);color:var(--s2)}
.tag.a{background:color-mix(in srgb,var(--s3) 14%,transparent);border-color:color-mix(in srgb,var(--s3) 34%,transparent);color:var(--s3)}
.tag.g{color:var(--ok-text)}
.tag.r{color:var(--crit)}
.tag i{width:6px;height:6px;border-radius:50%;display:block;background:currentColor}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;white-space:nowrap}
.st svg{width:13px;height:13px;flex:0 0 13px}
.st.good{color:var(--ok-text)}.st.warn{color:#8a6400}.st.crit{color:var(--crit)}.st.mute{color:var(--muted);font-weight:500}
:root[data-theme="dark"] .st.warn{color:var(--warn)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:9px;height:9px;border-radius:2px;display:block}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block;vertical-align:middle}

.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .09s;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:7px 9px;font-size:12px;box-shadow:0 5px 18px rgba(0,0,0,.13);z-index:5;
  min-width:116px;
}
:root[data-theme="dark"] .tip{box-shadow:0 5px 18px rgba(0,0,0,.5)}
.tip .th{font-weight:600;margin-bottom:5px;font-size:12px}
.tip .tr{display:flex;align-items:center;gap:7px;line-height:1.7}
.tip .tr .nm{color:var(--ink-2)}
.tip .tr .vv{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:550}

/* construct builder */
.levels{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.lvhead,.lvrow{display:grid;grid-template-columns:86px 1fr 1.25fr 1.1fr 34px;gap:10px;align-items:center;padding:8px 12px}
.lvhead{background:var(--page);border-bottom:1px solid var(--border);color:var(--muted);
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.lvrow{border-bottom:1px solid var(--grid)}
.lvrow:last-child{border-bottom:0}
.lvrow.active{background:color-mix(in srgb,var(--s1) 5%,var(--surface))}
.lvrow .lv{font-weight:600;font-variant-numeric:tabular-nums}
.lvrow select,.lvrow input{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:5px 7px;font-size:12.5px;width:100%;
}
.lvrow .dot{width:9px;height:9px;border-radius:50%;background:var(--grid);justify-self:center}
.lvrow.active .dot{background:var(--s1)}
.lvrow.fuse .dot{background:var(--s2)}
.readout{
  background:var(--page);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 15px;margin-top:14px;
}
.readout .k{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.readout .cls{font-size:17px;font-weight:620;margin:4px 0 2px;letter-spacing:-0.01em}
.readout .sig{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.readout .mini{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.readout .mini div{min-width:76px}
.readout .mini .mv{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.readout .mini .ml{font-size:11px;color:var(--muted)}

.spine{display:flex;flex-direction:column;gap:3px;align-items:center}
.spine .seg{
  width:62px;height:17px;border-radius:3px;background:var(--grid);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;border:1px solid transparent;
}
.spine .seg.adr{background:color-mix(in srgb,var(--s1) 78%,transparent);color:#fff;border-color:var(--surface)}
.spine .seg.facet{background:color-mix(in srgb,var(--s3) 80%,transparent);color:#fff}
.spine .seg.dynamic{background:color-mix(in srgb,var(--s4) 85%,transparent);color:#0b0b0b}
.spine .seg.interspinous{background:color-mix(in srgb,var(--s4) 55%,transparent);color:#0b0b0b}
.spine .seg.fusion{background:var(--s2);color:#fff}
.spine .seg.decomp{background:color-mix(in srgb,var(--muted) 42%,transparent);color:var(--ink)}
.spine .seg.adjacent{box-shadow:0 0 0 1.5px var(--crit)}

.rail{display:flex;gap:2px;align-items:center}
.rail i{width:12px;height:7px;border-radius:2px;background:var(--grid);display:block}
.rail i.adr{background:var(--s1)}.rail i.facet{background:var(--s3)}
.rail i.dynamic,.rail i.interspinous{background:var(--s4)}
.rail i.fusion{background:var(--s2)}.rail i.decomp{background:var(--baseline)}

.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0}
.banner{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);
  background:color-mix(in srgb,var(--s1) 7%,var(--surface));
  border:1px solid color-mix(in srgb,var(--s1) 26%,transparent);font-size:13px;line-height:1.55;
}
.banner svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px;color:var(--s1)}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));
  border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
.banner.warn svg{color:#8a6400}
:root[data-theme="dark"] .banner.warn svg{color:var(--warn)}
.banner b{font-weight:600}

.schema{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.75;
  background:var(--page);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;
  overflow-x:auto;white-space:pre;color:var(--ink-2)}
.schema b{color:var(--ink);font-weight:600}
.schema em{color:var(--s1);font-style:normal}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
}
.chip:hover{background:var(--page)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:550}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.srhid{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;
  cursor:pointer;color:var(--muted);font-size:13.5px;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}

/* ---------------- patient profile cards ---------------- */
.pgrid{display:grid;gap:13px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:15px 17px}
.pcard.accent{border-left:3px solid var(--s1)}
.pcard h4{font-size:14.5px;margin:0 0 12px}
.pcard h4.sm{font-size:12.5px;margin-bottom:10px}
.frow{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;align-items:baseline}
.frow dt{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.frow dd{margin:0;font-weight:550;text-align:right;font-variant-numeric:tabular-nums}
.frow dd.l{text-align:left;font-weight:500}
.unrec{color:var(--s3);font-weight:500;font-style:normal}
.unrec.q{color:var(--muted)}
.dlist{font-size:13px;line-height:1.95}
.dlist .d{color:var(--ink-2);font-variant-numeric:tabular-nums}
.dlist .v{color:var(--s1);font-weight:550}
.dlist .v.o{color:var(--s2)}
.consent{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--good) 15%,transparent);
  color:var(--ok-text);border-radius:20px;padding:1px 9px;font-size:11px;font-weight:650;letter-spacing:.03em}
.secnav{display:flex;flex-direction:column;gap:2px}

.inilock{display:inline-flex;align-items:center;gap:15px}

/* ------------------- the construct classifier --------------------- */
/* This is the part no existing registry has: the construct, not the CPT code,
   is the unit of analysis. */
function classify(levels){
  const treated = Object.entries(levels).filter(([,v])=>v.tx && v.tx!=='none');
  const out = {
    type:'No index level', family:'none', signature:'—',
    mobile:0, fused:0, indexLevels:[], adjacent:[], devices:[], hybrid:false, counts:{},
  };
  if(!treated.length) return out;

  const counts = {};
  for(const [,v] of treated) counts[v.tx]=(counts[v.tx]||0)+1;
  out.counts = counts;

  const region = treated[0][0][0]==='C' ? 'Cervical'
               : treated[0][0][0]==='T' ? 'Thoracic' : 'Lumbar';
  const ordered = levelsFor(region).filter(l=>levels[l] && levels[l].tx!=='none');
  out.indexLevels = ordered;

  out.mobile = ordered.filter(l=>TX[levels[l].tx].motion===true).length;
  out.fused  = ordered.filter(l=>TX[levels[l].tx].motion===false).length;
  out.signature = ordered.map(l=>`${l} ${TX[levels[l].tx].short}`).join('  +  ');
  out.devices = ordered.filter(l=>levels[l].device).map(l=>levels[l].device);

  /* adjacent segments at risk = the mobile neighbours of the construct */
  const all = levelsFor(region);
  const idx = ordered.map(l=>all.indexOf(l));
  const lo=Math.min(...idx), hi=Math.max(...idx);
  out.adjacent = [all[lo-1], all[hi+1]].filter(Boolean);

  const nAdr=counts.adr||0, nFac=counts.facet||0, nDyn=counts.dynamic||0,
        nIsp=counts.interspinous||0, nFus=counts.fusion||0, nDec=counts.decomp||0;
  const nMotionImplant = nAdr+nFac+nDyn+nIsp;

  if(nFus && nMotionImplant){
    out.hybrid = true; out.family='hybrid';
    const parts=[];
    if(nAdr) parts.push(`${nAdr}-level ADR`);
    if(nFac) parts.push(`${nFac}-level facet arthroplasty`);
    if(nDyn) parts.push('dynamic stabilization');
    if(nIsp) parts.push('interspinous device');
    out.type = `Hybrid — ${parts.join(' + ')} + ${nFus}-level fusion`;
  } else if(nAdr && nFac){
    out.hybrid=true; out.family='multi_arthro';
    out.type = `Combined arthroplasty — ${nAdr}-level ADR + ${nFac}-level facet replacement`;
  } else if(nAdr && !nFus){
    out.family='adr';
    out.type = nAdr===1 ? '1-level total disc replacement' : `${nAdr}-level total disc replacement`;
  } else if(nFac && !nFus){
    out.family='facet';
    out.type = `${nFac}-level facet arthroplasty`;
  } else if((nDyn||nIsp) && !nFus){
    out.family='dynamic';
    out.type = nDyn? `${nDyn}-level posterior dynamic stabilization` : `${nIsp}-level interspinous device`;
  } else if(nFus){
    out.family='fusion';
    out.type = `${nFus}-level fusion${nDec?' + decompression':''} (comparator arm)`;
  } else if(nDec){
    out.family='decomp';
    out.type = `${nDec}-level decompression only (comparator arm)`;
  }
  out.region = region;
  return out;
}

/* Seed the safety record. Perioperative events at published incidences, plus
   the events the rest of this case already implies — a reoperation, symptomatic
   adjacent segment disease and motion-restricting ossification are all reportable
   adverse events, so the safety table has to agree with the outcome tables. */
function seedAEs(c){
  const out=[]; const d0=c.date.getTime();
  const on = (lo,hi)=> new Date(d0+ri(lo,hi)*864e5).toISOString().slice(0,10);
  const add = (type,onset,severity,serious,related,action,outcome,resolved)=>
    out.push({type,onset,severity,serious,related,action,outcome,resolved:resolved||'',
      reported: serious==='Yes'?'Yes':'No', narrative:'', seeded:true});
  const isC = c.region==='Cervical';
  if(isC && chance(.16)) add('Dysphagia', on(0,3), 'Grade 1 — mild','No','Possibly related',
      'None','Resolved', new Date(d0+ri(14,70)*864e5).toISOString().slice(0,10));
  if(isC && chance(.045)) add('Dysphonia / hoarseness', on(0,3),'Grade 1 — mild','No','Possibly related',
      'None','Resolved', new Date(d0+ri(20,120)*864e5).toISOString().slice(0,10));
  if(chance(.016)) add('Dural tear / CSF leak', on(0,1),'Grade 2 — moderate','No','Unrelated',
      'Medical management','Resolved', new Date(d0+ri(3,21)*864e5).toISOString().slice(0,10));
  if(chance(.012)) add('Superficial surgical site infection', on(5,24),'Grade 2 — moderate','No',
      'Unlikely related','Medical management','Resolved', new Date(d0+ri(25,60)*864e5).toISOString().slice(0,10));
  if(chance(.008)) add('Deep vein thrombosis', on(2,21),'Grade 2 — moderate','No','Unrelated',
      'Medical management','Resolved','');
  if(chance(.013)) add('New or worsened radiculopathy', on(1,60),'Grade 2 — moderate','No',
      'Possibly related','Physical therapy', chance(.6)?'Resolved':'Ongoing','');
  if(chance(.006)) add('New neurological deficit', on(0,2),'Grade 3 — severe','Yes','Possibly related',
      'Medical management', chance(.5)?'Resolved with sequelae':'Ongoing','');
  if(c.hoGrade>=3) add('Motion-restricting heterotopic ossification',
      new Date(d0+ri(400, Math.max(500,c.daysSince))*864e5).toISOString().slice(0,10),
      'Grade 2 — moderate','No','Probably related','None','Ongoing','');
  if(c.asd) add('Adjacent segment disease',
      new Date(d0+TP[c.asdTp||'5y'].days*864e5).toISOString().slice(0,10),
      'Grade 2 — moderate','No','Possibly related', chance(.4)?'Injection':'Physical therapy','Ongoing','');
  if(c.reop) add('Unplanned reoperation',
      new Date(d0+(TP[c.reop.tp]?TP[c.reop.tp].days:365)*864e5).toISOString().slice(0,10),
      'Grade 3 — severe','Yes',
      /migrat|subsid|loosen|fracture|wear/i.test(c.reop.reason||'')?'Probably related':'Possibly related',
      'Reoperation','Resolved with sequelae','');
  return out.sort((a,b)=>a.onset<b.onset?-1:1);
}
function makeCase(i){
  const t = pick(TPOOL);
  const levels = t.build();
  const region = t.region;
  for(const k of Object.keys(levels)){
    const tx = levels[k].tx;
    const dl = deviceList(tx, region);
    if(dl.length){ const d=pick(dl); levels[k].device=d[0]; levels[k].mfr=d[1];
      levels[k].udi = `(01)0${ri(10000000,99999999)}${ri(100,999)}(17)2${ri(70,99)}0${ri(1,9)}`; }
  }
  const c = classify(levels);
  /* surgery date spread over the last 11 years so the 10-yr column is populated */
  const daysAgo = Math.round(rr(40, 4015));
  const dt = new Date(Date.now()-daysAgo*864e5);
  const age = ri(28,69);
  const motionCase = c.mobile>0 && c.family!=='fusion' && c.family!=='decomp';

  /* --- PROMs: baseline + decaying follow-up capture --- */
  const isCerv = region==='Cervical';
  const base = {
    primary: isCerv? Math.round(rr(32,62)) : Math.round(rr(38,68)),  // NDI or ODI
    axial:   +rr(5.5,9).toFixed(1),   // NRS neck/back
    limb:    +rr(4.5,9).toFixed(1),   // NRS arm/leg
    eq5d:    +rr(0.28,0.56).toFixed(2),
  };
  /* progressive loss of motion in a subset, so retained ROM is continuous
     rather than a binary mobile/ankylosed split. In this synthetic model decay
     stands for how well the construct tracks: a level that moves off-axis loads
     the facets, ossifies, stiffens and does worse. That is the hypothesis the
     registry exists to test, so it is the hypothesis the demo data encodes. */
  const decay = chance(.42)? rr(0.84,0.975) : 1;
  const offAxis = clamp((1-decay)/0.16, 0, 1);          // 0 = tracks true, 1 = worst
  /* responder or not: ~78% achieve MCID overall, fewer among the off-axis */
  const responder = chance((motionCase?0.84:0.72) - (motionCase? 0.46*offAxis : 0));
  const gain = (responder? rr(0.62,0.86) : rr(0.12,0.38)) - (motionCase? 0.20*offAxis : 0);

  const proms={}, radio={};
  let ankylosed=false, hoGrade=0, asd=false, asdTp=null, reop=null;
  const preRom = isCerv? +rr(6.5,11.5).toFixed(1) : +rr(5.0,9.0).toFixed(1);

  for(const tp of TIMEPOINTS){
    if(tp.days>daysAgo) break;              // not yet due
    const yrs = tp.days/365;
    /* capture probability — the attrition curve this registry fights */
    const pcap = tp.k==='pre'?1 : tp.k==='6w'?0.95 : tp.k==='3m'?0.93 : tp.k==='6m'?0.90
               : tp.k==='1y'?0.87 : tp.k==='2y'?0.80 : tp.k==='3y'?0.74
               : tp.k==='5y'?0.68 : tp.k==='7y'?0.60 : 0.52;
    if(tp.k!=='pre' && !chance(pcap)) continue;

    if(tp.k==='pre'){
      proms.pre={...base};
    } else {
      const ramp = Math.min(1, tp.days/140);                 // most gain by ~4-5 mo
      const drift = 1 - Math.min(0.17, Math.max(0, (yrs-2))*0.035); // slow late drift
      const g = gain*ramp*drift;
      proms[tp.k]={
        primary: Math.max(0, Math.round(base.primary*(1-g)+rr(-3,3))),
        axial:   Math.max(0, +(base.axial*(1-g)+rr(-.7,.7)).toFixed(1)),
        limb:    Math.max(0, +(base.limb*(1-g*1.05)+rr(-.7,.7)).toFixed(1)),
        eq5d:    Math.min(1, +(base.eq5d+(0.92-base.eq5d)*g*0.86+rr(-.04,.04)).toFixed(2)),
        satisfied: responder? chance(0.93) : chance(0.42),
        workStatus: pick(responder?['Original job','Original job','Original job','Modified duties']:['Modified duties','Not working','Original job']),
      };
    }

    if(!tp.radio) continue;
    if(tp.k==='pre'){ radio.pre={rom:Object.fromEntries(c.indexLevels.map(l=>[l,preRom+ +rr(-1,1).toFixed(1)])),ho:0,asd:false}; continue; }
    /* ROM: modest rise to 24 mo, then decline — matches the published pattern */
    let f = yrs<=2 ? 1+0.11*Math.min(yrs,2)/2 : 1.11-0.042*(yrs-2);
    f *= Math.pow(decay, yrs);
    /* Ossification and ankylosis are downstream of how the level tracks, so a
       construct that moves off-axis is the one that stiffens and ossifies. */
    if(!ankylosed && motionCase && yrs>=2 && chance(0.050*(yrs-1)*(0.45+2.4*offAxis))) ankylosed=true;
    if(hoGrade<4 && isCerv && motionCase && yrs>=1 && chance(0.15+0.32*offAxis)) hoGrade=Math.min(4,hoGrade+ri(1,2));
    if(!asd && yrs>=2 && chance(0.055*(yrs-1))){ asd=true; asdTp=tp.k; }
    const rom={};
    for(const l of c.indexLevels){
      if(TX[levels[l].tx].motion===false){ rom[l]=0; continue; }
      if(levels[l].tx==='decomp'){ rom[l]=+Math.max(1.5,preRom*f*rr(.9,1.1)).toFixed(1); continue; }
      rom[l]= ankylosed ? +rr(0.3,2.4).toFixed(1)
                        : +Math.max(0.4, preRom*f*rr(0.84,1.16)).toFixed(1);
    }
    radio[tp.k]={rom, ho:hoGrade, asd, migration: chance(0.025), subsidence: chance(0.03)};
  }
  if(chance(0.075)){
    const pool = TIMEPOINTS.filter(t=>t.days>120 && t.days<=daysAgo);
    if(pool.length) reop={tp:pick(pool).k, reason:pick(['Adjacent segment surgery','Device revision','Supplemental fixation','Decompression at index level','Implant removal'])};
  }

  /* anthropometrics — height and weight are captured, BMI is always derived */
  const sex = chance(.52)?'F':'M';
  const heightCm = sex==='F'? Math.round(rr(152,176)) : Math.round(rr(165,190));
  const weightKg = Math.round(rr(18.5,33) * Math.pow(heightCm/100,2));
  const dob = new Date(dt.getTime() - age*365.25*864e5 - ri(0,364)*864e5);

  let _site;
  const rec = {
    id:'MPSR-'+String(1000+i),
    name: pick(FIRSTNAMES)+' '+pick(SURNAMES),
    dob, sex, heightCm, weightKg,
    sexAtBirth: sex==='F'?'Female':'Male',
    genderIdentity: sex==='F'?'Woman':'Man',
    phone: '(555) '+ri(200,989)+'-'+String(ri(1000,9999)),
    email: 'patient'+ri(1000,9999)+'@example.com',
    address: ri(100,9899)+' '+pick(['Ocean','Wilshire','Montana','Pico','Lincoln','Barrington'])+
      ' '+pick(['Blvd','Ave','St'])+', '+pick(['Santa Monica','Los Angeles','Culver City','Torrance'])+', CA '+ri(90001,90899),
    referrer: pick(['Dr. L. Prasad (PM&R)','Dr. S. Okonkwo (Neurology)','Self-referred','Dr. M. Byrne (Primary care)']),
    enrolled: true,
    trial: chance(.17)? {participating:true, name:pick(TRIALS), nct:'NCT0'+ri(4000000,5999999),
      arm:pick(['Investigational','Control','Registry arm'])} : {participating:false},
    comorbidities: (()=>{const n=ri(0,4),p=[...COMORBIDITIES];const out=[];
      for(let k=0;k<n;k++) out.push(...p.splice(Math.floor(rnd()*p.length),1)); return out;})(),
    substances: (()=>{
      const tob=pick([TOBACCO[0],TOBACCO[0],TOBACCO[1],TOBACCO[2]]);
      return {
        tobacco:{status:tob, packYears: tob==='Never'?null:ri(2,40), years: tob==='Never'?null:ri(3,35)},
        alcohol:{status:pick(ALCOHOL), years: chance(.7)? ri(2,40):null},
        cannabis:{status:pick([CANNABIS[0],CANNABIS[0],CANNABIS[0],CANNABIS[2],CANNABIS[4]]), years: chance(.3)? ri(1,25):null},
        other:{status:pick([OTHER_DRUGS[0],OTHER_DRUGS[0],OTHER_DRUGS[0],OTHER_DRUGS[1]]), years:null},
      };})(),
    meds: (()=>{const out=[];
      if(chance(.72)) out.push({cls:'NSAID',detail:'Daily',months:ri(2,48)});
      if(chance(.30)) out.push({cls:'Neuropathic agent',detail:'Gabapentin 300–900 mg',months:ri(1,24)});
      if(chance(.26)) out.push({cls:'Muscle relaxant',detail:'PRN',months:ri(1,18)});
      if(chance(.22)) out.push({cls:'Corticosteroid (injected)',detail:String(ri(1,3))+' injections',months:ri(1,12)});
      if(chance(.12)) out.push({cls:'Corticosteroid (oral)',detail:'Taper courses',months:ri(1,6)});
      if(chance(.09)) out.push({cls:'Bone agent',detail:'Bisphosphonate',months:ri(6,60)});
      return out;})(),
    tests: [],
    visitsExtra: [],
    /* external linkage: the registry's defence against reoperations that
       happened somewhere it cannot see */
    external: (()=>{
      const linked = chance(.86);
      const ev=[];
      if(linked && chance(.028)) ev.push({
        date:new Date(dt.getTime()+ri(400, Math.max(500,daysAgo))*864e5).toISOString().slice(0,10),
        type:pick(OUTSIDE_EVENTS), facility:pick(['Out-of-network hospital','Another health system','Ambulatory surgery center']),
        source:pick([OUTSIDE_SOURCES[0],OUTSIDE_SOURCES[0],OUTSIDE_SOURCES[1],OUTSIDE_SOURCES[3]]),
      });
      return {linked, lastChecked:linked? new Date(Date.now()-ri(5,80)*864e5):null,
        outsideEvents:ev, ndiChecked:linked, vitalStatus: chance(.02)?'Deceased':'Alive'};
    })(),
    queries: (()=>{
      const n = chance(.26)? ri(1,2) : 0, out=[];
      for(let k=0;k<n;k++){
        const open = chance(.55);
        out.push({id:'Q'+ri(1000,9999), field:pick(['Segmental ROM C5-C6','ODI at 2 yr','Implant UDI',
            'Height','HO grade','Adverse event severity','Operative time']),
          section:pick(['s_align','s_prom','s_construct','s_top','s_ae']),
          reason:pick(QUERY_REASONS),
          raised:new Date(Date.now()-ri(3,120)*864e5).toISOString().slice(0,10),
          raisedBy:'Data management', status: open?'Open':'Resolved',
          response: open? null : pick(['Corrected from source document','Confirmed as entered','Value re-measured','Record updated']),
        });
      }
      return out;
    })(),
    audit: (()=>{
      const base=new Date(dt.getTime()+ri(1,20)*864e5);
      return [
        {ts:base.toISOString().slice(0,16).replace('T',' '), user:'coordinator@nsg', action:'Case created', field:'—', from:'—', to:'—'},
        {ts:new Date(base.getTime()+864e5).toISOString().slice(0,16).replace('T',' '),
         user:'coordinator@nsg', action:'Operative record entered', field:'construct', from:'—', to:'recorded'},
      ];
    })(),
    ethnicity: chance(.22)? ETHNICITY[0] : (chance(.95)? ETHNICITY[1] : ETHNICITY[2]),
    race: pick([RACE[4],RACE[4],RACE[4],RACE[1],RACE[2],RACE[5],RACE[6]]),
    education: chance(.85)? pick(EDUCATION) : null,
    workType: chance(.9)? pick(WORK_TYPE) : null,
    consent: {given:true, version:'MPSR-ICF v1.2', date:new Date(dt.getTime()-ri(3,30)*864e5),
      imaging:true, industryShare:chance(.88), recontactYears:10},
    diabetes: chance(.14), osteoporosis: chance(.09),
    tScore: chance(.55)? +rr(-2.9,0.8).toFixed(1) : null,
    workersComp: chance(.11), litigation: chance(.06),
    preopOpioid: chance(.38),
    symptomMonths: ri(4,60),
    mrn:'•••'+ri(100,999),
    site: (_site = i%7===0? pick(SITES) : (chance(.52)? SITES[0] : pick(SITES))),
    /* Same random draws as before, so the rest of the synthetic cohort is
       unchanged; the draw is then mapped onto a surgeon who works at this site. */
    surgeon: (()=>{
      const list = surgeonsAt(_site);
      if(chance(.45)) return list[0];
      const x = pick(SURGEONS);
      return list[SURGEONS.indexOf(x) % list.length];
    })(),
    age,
    smoker: chance(.17), priorSurgery: chance(.21),

    region, levels, construct:c, date:dt, daysSince:daysAgo,

  };
  rec.aes = seedAEs(rec);
  /* Randomized trials report similar or slightly better patient-reported
     outcomes after disc replacement than after fusion. Scale the synthetic
     fusion arm's improvement to match, after the random draws are made. */
  if(rec.construct.family==='fusion' && rec.proms.pre){
    const pre=rec.proms.pre.primary;
    Object.keys(rec.proms).forEach(k=>{ if(k==='pre') return;
      const v=rec.proms[k]; v.primary = Math.round(pre - (pre - v.primary)*0.74); });
  }
  /* About one in ten patients with a BMI of 27 or more is on a GLP-1 drug.
     Chosen by a fixed hash of the case number rather than the random stream,
     so adding it changes nothing else in the synthetic cohort. */
  { const b=bmiFrom(rec.heightCm, rec.weightKg), h=((i+7)*2654435761>>>0)%100;
    if(b!=null && b>=27 && h<22){
      const sema = h%3!==0;
      rec.meds.push(sema
        ? {agent:'Semaglutide (Ozempic, Wegovy)', cls:'GLP-1 receptor agonist', dose:h%2?'1':'0.5', unit:'mg', route:'SC', freq:'Weekly', months:3+h%20}
        : {agent:'Tirzepatide (Mounjaro, Zepbound)', cls:'GLP-1 receptor agonist', dose:'5', unit:'mg', route:'SC', freq:'Weekly', months:2+h%14});
    } }
  return rec;
}

const DUE_WINDOW = {'6w':21,'3m':30,'6m':45,'1y':60,'2y':90,'3y':90,'5y':120,'7y':120,'10y':150};
function fuStatus(c, tpk){
  const tp=TP[tpk]; if(tp.days>c.daysSince) return 'future';
  if(c.proms[tpk]) return 'captured';
  const overdueBy = c.daysSince - tp.days;
  return overdueBy > (DUE_WINDOW[tpk]||60) ? 'missed' : 'due';
}
function dueNow(){
  const rows=[];
  for(const c of CASES) for(const tp of TIMEPOINTS){
    if(tp.k==='pre') continue;
    const s=fuStatus(c,tp.k);
    if(s==='due') rows.push({c,tp,status:s,overdue:c.daysSince-tp.days});
  }
  return rows.sort((a,b)=>b.overdue-a.overdue);
}
function fuRate(tpk){
  const eligible = CASES.filter(c=>TP[tpk].days<=c.daysSince);
  const got = eligible.filter(c=>c.proms[tpk]);
  return {n:got.length, d:eligible.length, rate: eligible.length? 100*got.length/eligible.length : null};
}
function latestRadio(c){
  const keys = TIMEPOINTS.filter(t=>t.k!=='pre'&&c.radio[t.k]).map(t=>t.k);
  return keys.length? {k:keys[keys.length-1], v:c.radio[keys[keys.length-1]]} : null;
}
function latestProm(c){
  const keys = TIMEPOINTS.filter(t=>t.k!=='pre'&&c.proms[t.k]).map(t=>t.k);

function barPath(x,y,w,h,r=4){

}

  if(w<=0.5) return `M${x},${y} v${h}`;

/* ---- line chart with crosshair ---- */
function lineChart({series, xLabels, yLabel, yMin=0, yMax=null, height=250, valFmt=(v)=>fmt(v,1)}){
  const W=760, H=height, M={t:14,r:66,b:30,l:44};
  const all = series.flatMap(s=>s.points.map(p=>p.y)).filter(v=>v!=null);
  const hi = yMax ?? (Math.ceil(Math.max(...all,1)*1.18));
  const lo = yMin;
  const px = i => M.l + (xLabels.length>1 ? i*(W-M.l-M.r)/(xLabels.length-1) : 0);
  const py = v => M.t + (H-M.t-M.b) * (1-(v-lo)/(hi-lo));

  const wrap = el('div',{class:'chartwrap'});
  const svg = svgEl('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':yLabel||'chart'});
  const ticks = 5;
  for(let i=0;i<=ticks;i++){
    const v = lo+(hi-lo)*i/ticks, y=py(v);
    svg.append(svgEl('line',{x1:M.l,x2:W-M.r,y1:y,y2:y,stroke:CSS(i===0?'--baseline':'--grid'),'stroke-width':1}));
    const tx=svgEl('text',{x:M.l-9,y:y+4,fill:CSS('--muted'),'font-size':10.5,'text-anchor':'end'});
    tx.textContent = valFmt(v); svg.append(tx);
  }
  xLabels.forEach((l,i)=>{
    const t=svgEl('text',{x:px(i),y:H-M.b+17,fill:CSS('--muted'),'font-size':10.5,'text-anchor':'middle'});
    t.textContent=l; svg.append(t);
  });
  /* series */
  series.forEach(s=>{
    const pts = s.points.map((p,i)=>({...p,i})).filter(p=>p.y!=null);
    if(!pts.length) return;
    const d = pts.map((p,k)=>`${k?'L':'M'}${px(p.i)},${py(p.y)}`).join(' ');
    svg.append(svgEl('path',{d,fill:'none',stroke:s.color,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
    pts.forEach(p=>{
      svg.append(svgEl('circle',{cx:px(p.i),cy:py(p.y),r:4,fill:s.color,stroke:CSS('--surface'),'stroke-width':2}));
    });
  });
  /* direct labels (<=4 series), de-collided. Only label series that run to the
     right-hand edge — a label dropped mid-plot lands on top of other lines. */
  if(series.length<=4){
    const lab = series.map(s=>{
      const pts=s.points.map((p,i)=>({...p,i})).filter(p=>p.y!=null);
      if(!pts.length) return null;
      const last=pts[pts.length-1];
      if(last.i < xLabels.length-3) return null;
      return {name:s.name,color:s.color,x:px(last.i),y:py(last.y)};
    }).filter(Boolean).sort((a,b)=>a.y-b.y);
    for(let i=1;i<lab.length;i++) if(lab[i].y-lab[i-1].y<12) lab[i].y=lab[i-1].y+12;
    lab.forEach(L=>{
      const t=svgEl('text',{x:Math.min(L.x+9,W-M.r+6),y:L.y+3.5,fill:L.color,'font-size':10.5,'font-weight':600});
      t.textContent=L.name; svg.append(t);
    });
  }
  /* hover */
  const cross = svgEl('line',{y1:M.t,y2:H-M.b,stroke:CSS('--baseline'),'stroke-width':1,opacity:0});
  svg.append(cross);
  const hit = svgEl('rect',{x:M.l,y:M.t,width:W-M.l-M.r,height:H-M.t-M.b,fill:'transparent'});
  svg.append(hit);
  wrap.append(svg);
  const tip = tipFor(wrap);
  hit.addEventListener('mousemove',ev=>{
    const r=svg.getBoundingClientRect();
    const rel=(ev.clientX-r.left)/r.width*W;
    let i=0,best=1e9;
    xLabels.forEach((_,k)=>{const d=Math.abs(px(k)-rel); if(d<best){best=d;i=k;}});
    cross.setAttribute('x1',px(i)); cross.setAttribute('x2',px(i)); cross.setAttribute('opacity','1');
    const rows = series.map(s=>{
      const p=s.points[i];
      return p&&p.y!=null? `<div class="tr"><span class="swatch" style="background:${s.color}"></span>
        <span class="nm">${esc(s.name)}</span><span class="vv">${valFmt(p.y)}${p.n!=null?` <span style="color:var(--muted);font-weight:400">n=${p.n}</span>`:''}</span></div>`:'';
    }).join('');
    tip.show(`<div class="th">${esc(xLabels[i])}</div>${rows||'<div class="tr"><span class="nm">no data</span></div>'}`,
      px(i)/W*r.width, py(hi)/H*r.height+34);
  });
  hit.addEventListener('mouseleave',()=>{tip.hide();cross.setAttribute('opacity','0');});
  return wrap;
}

/* ---- vertical bars, optionally grouped ---- */
function barsV({groups, series, yLabel, yMax=100, height=230, width=760, valFmt=v=>Math.round(v)+'%'}){
  const W=width,H=height,M={t:14,r:12,b:34,l:42};
  const bw=(W-M.l-M.r)/groups.length;
  const py=v=>M.t+(H-M.t-M.b)*(1-v/yMax);
  const wrap=el('div',{class:'chartwrap',style:width<760?`max-width:${width}px`:null});
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':yLabel||'chart'});
  for(let i=0;i<=4;i++){
    const v=yMax*i/4,y=py(v);
    svg.append(svgEl('line',{x1:M.l,x2:W-M.r,y1:y,y2:y,stroke:CSS(i===0?'--baseline':'--grid'),'stroke-width':1}));
    const t=svgEl('text',{x:M.l-9,y:y+4,fill:CSS('--muted'),'font-size':10.5,'text-anchor':'end'});
    t.textContent=valFmt(v); svg.append(t);
  }
  const tip=tipFor(wrap);
  groups.forEach((g,gi)=>{
    const cx=M.l+bw*gi+bw/2;
    const t=svgEl('text',{x:cx,y:H-M.b+17,fill:CSS('--muted'),'font-size':10.5,'text-anchor':'middle'});
    t.textContent=g.label; svg.append(t);
    /* lay out only the series that have a value here, centered in the slot, so a
       missing comparator leaves no orphan gap */
    const present = series.filter(s=>s.values[gi]!=null);
    const n = present.length || 1;
    const inner = Math.min(bw-14, n*34), each=(inner-2*(n-1))/n;
    present.forEach((s,si)=>{
      const v=s.values[gi];
      const x=cx-inner/2+si*(each+2), y=py(v), h=py(0)-y;
      const p=svgEl('path',{d:barPath(x,y,each,h,4),fill:s.color,style:'cursor:pointer'});
      p.addEventListener('mousemove',ev=>{
        const r=svg.getBoundingClientRect();
        tip.show(`<div class="th">${esc(g.label)}</div>`+series.map(ss=>ss.values[gi]==null?'':
          `<div class="tr"><span class="swatch" style="background:${ss.color}"></span><span class="nm">${esc(ss.name)}</span><span class="vv">${valFmt(ss.values[gi])}${ss.notes&&ss.notes[gi]?` <span style="color:var(--muted);font-weight:400">${esc(ss.notes[gi])}</span>`:''}</span></div>`).join(''),
          (x+each/2)/W*r.width, y/H*r.height);
      });
      p.addEventListener('mouseleave',()=>tip.hide());
      svg.append(p);
    });
  });
  wrap.append(svg);
  return wrap;
}

/* ---- horizontal bars, single hue (axis already names the categories) ---- */
function barsH({bars, height=null, valFmt=v=>String(v), color=null, labelW=210, width=520, maxLabel=40, scaleMax=null}){

   A schematic lateral film built from the patient's own recorded data:
   each disc is drawn at the angle the registry holds for it, and every
   number below is measured off that geometry rather than stored. Flexion
   and extension are generated by redistributing each level's recorded ROM,

    bodies:['T1','C7','C6','C5','C4','C3','C2'],
    discs:['C7-T1','C6-C7','C5-C6','C4-C5','C3-C4','C2-C3'],
    neutral:[22,19,13,7,3,1,0],
    w:34,h:20,disc:8,mmPerPx:0.75, x0:150, y0:330,
  },
  Lumbar:{
    bodies:['S1','L5','L4','L3','L2','L1'],
    discs:['L5-S1','L4-L5','L3-L4','L2-L3','L1-L2'],
    neutral:[40,24,12,3,-5,-15],
    w:48,h:31,disc:12,mmPerPx:1.0, x0:150, y0:352,
  },
};
const DEG = r => r*Math.PI/180;
const toDeg = r => r*180/Math.PI;

/* Build vertebral bodies bottom-up from a rotation list. Anterior is -x. */
function buildBodies(region, rots){
  const G=SPINE_GEOM[region];
  const out=[]; let cx=G.x0, cy=G.y0;
  for(let i=0;i<rots.length;i++){
    out.push({name:G.bodies[i], cx, cy, rot:rots[i], w:G.w, h:G.h});
    if(i<rots.length-1){
      const rr=DEG((rots[i]+rots[i+1])/2), step=G.h+G.disc;
      cx += Math.sin(rr)*step;
      cy -= Math.cos(rr)*step;
    }
  }
  return out;
}
/* corner helper: sx,sy in {-1,+1}; -x is anterior, -y is superior */
function corner(b, sx, sy){
  const r=DEG(b.rot), lx=sx*b.w/2, ly=sy*b.h/2;
  return {x: b.cx + lx*Math.cos(r) - ly*Math.sin(r),
          y: b.cy + lx*Math.sin(r) + ly*Math.cos(r)};
}
function bodyPath(b){
  const p=[corner(b,-1,-1),corner(b,1,-1),corner(b,1,1),corner(b,-1,1)];
  return 'M'+p.map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' L')+' Z';
}

/* ---------------- center of rotation ----------------
   COR is expressed in the LOWER vertebra's own frame:
     u = fraction of body depth, 0 = posterior wall → 1 = anterior wall
     v = fraction of body height, 0 = superior endplate → 1 = inferior endplate
   Reference bands below are illustrative, not fitted norms. The published
   pattern they encode is that the COR sits posteriorly within the lower body
   and migrates progressively cranially from C2-C3 down to C6-C7.
   ---------------------------------------------------- */
const COR_REF = {
  'C2-C3':{u:0.42,v:0.62}, 'C3-C4':{u:0.41,v:0.55}, 'C4-C5':{u:0.40,v:0.47},
  'C5-C6':{u:0.39,v:0.40}, 'C6-C7':{u:0.38,v:0.34}, 'C7-T1':{u:0.38,v:0.30},
  'L1-L2':{u:0.36,v:0.16}, 'L2-L3':{u:0.35,v:0.14}, 'L3-L4':{u:0.35,v:0.13},
  'L4-L5':{u:0.34,v:0.12}, 'L5-S1':{u:0.33,v:0.10},
};
const COR_TOL = 0.12;              /* within this distance of reference = physiological */
const COR_MIN_ROM = 3.0;           /* below this rotation the fixed point is unstable */

/* global position of a normalized COR inside a body */
function corGlobal(b, uv){
  const lx = b.w/2 - uv.u*b.w, ly = -b.h/2 + uv.v*b.h, r=DEG(b.rot);
  return {x: b.cx + lx*Math.cos(r) - ly*Math.sin(r),
          y: b.cy + lx*Math.sin(r) + ly*Math.cos(r)};
}
function rotateBody(b, c, deg){
  const r=DEG(deg), dx=b.cx-c.x, dy=b.cy-c.y;
  return {...b, cx: c.x + dx*Math.cos(r) - dy*Math.sin(r),
                cy: c.y + dx*Math.sin(r) + dy*Math.cos(r), rot: b.rot+deg};
}
/* express a global point in a body's local frame */
function localize(p, b){
  const r=DEG(-b.rot), dx=p.x-b.cx, dy=p.y-b.cy;
  return {x: dx*Math.cos(r) - dy*Math.sin(r), y: dx*Math.sin(r) + dy*Math.cos(r)};
}
/* Each case carries its own COR offsets, so devices and patients differ. */
function corMapFor(c){
  const G=SPINE_GEOM[c.region]; const out={};
  if(!G) return out;
  let h=0; for(const ch of c.id) h=(h*31+ch.charCodeAt(0))|0;
  const rnd2=mulberry32(Math.abs(h)||7);
  G.discs.forEach(d=>{
    const ref=COR_REF[d]||{u:0.38,v:0.35};
    const tx = c.levels[d]? c.levels[d].tx : null;
    /* an implant shifts the axis; a native level barely moves */
    /* An implant shifts the axis; a native level barely moves. How far it
       shifts tracks with how badly the construct is doing, which is the
       mechanism, not a coincidence. */
    const off = c.decay==null? 0 : clamp((1-c.decay)/0.16, 0, 1);
    const base = tx==='adr'? 0.11 : tx==='facet'? 0.07 : 0.040;
    const mag = tx&&tx!=='none'? base*(0.45 + 1.9*off) : base;
    const th = rnd2()*Math.PI*2, r = mag*(0.55+0.45*rnd2());
    out[d] = {u: ref.u + r*Math.cos(th), v: ref.v + r*Math.sin(th)};
  });
  return out;
}
/* Build a pose by rotating everything above each disc about that disc's COR. */
function buildPose(region, rom, mode, corMap){
  const G=SPINE_GEOM[region];
  let bodies = buildBodies(region, G.neutral);
  if(mode!=='neutral'){
    const a = mode==='flexion'? 0.55 : -0.45;
    G.discs.forEach((d,i)=>{
      const R = rom[d]??0; if(!R) return;
      const c = corGlobal(bodies[i], (corMap&&corMap[d])||COR_REF[d]||{u:0.38,v:0.35});
      const ang = a*R;
      for(let k=i+1;k<bodies.length;k++) bodies[k]=rotateBody(bodies[k], c, ang);
    });
  }
  return bodies;
}
/* Recover the COR from two poses: rigid fit of the upper body in the lower
   body's frame, then the fixed point of that transform. */
function measureCOR(bFlex, bExt, i){
  const loA=bFlex[i], upA=bFlex[i+1], loB=bExt[i], upB=bExt[i+1];
  const cs=[[-1,-1],[1,-1],[1,1],[-1,1]];
  const A=cs.map(([sx,sy])=>localize(corner(upA,sx,sy), loA));
  const B=cs.map(([sx,sy])=>localize(corner(upB,sx,sy), loB));
  const ca={x:mean(A.map(p=>p.x)), y:mean(A.map(p=>p.y))};
  const cb={x:mean(B.map(p=>p.x)), y:mean(B.map(p=>p.y))};
  let sx=0, sy=0;
  for(let k=0;k<A.length;k++){
    const ax=A[k].x-ca.x, ay=A[k].y-ca.y, bx=B[k].x-cb.x, by=B[k].y-cb.y;
    sy += ax*by - ay*bx;
    sx += ax*bx + ay*by;
  }
  const th=Math.atan2(sy,sx), deg=toDeg(th);
  if(Math.abs(deg) < COR_MIN_ROM) return {rom:Math.abs(deg), computable:false};
  const cth=Math.cos(th), sth=Math.sin(th);
  /* translation of the rigid map, then solve (I-R)c = t */
  const tx = cb.x - (ca.x*cth - ca.y*sth);
  const ty = cb.y - (ca.x*sth + ca.y*cth);
  const det = 2*(1-cth);
  if(Math.abs(det)<1e-9) return {rom:Math.abs(deg), computable:false};
  const cx = ((1-cth)*tx - sth*ty)/det;
  const cy = ( sth*tx + (1-cth)*ty)/det;
  /* back to normalized coordinates of the lower body */
  const u = (loA.w/2 - cx)/loA.w, v = (cy + loA.h/2)/loA.h;
  return {rom:Math.abs(deg), computable:true, u, v, x:cx, y:cy};
}
function corDeviation(d, m){
  const ref=COR_REF[d]; if(!ref||!m.computable) return null;
  return Math.hypot(m.u-ref.u, m.v-ref.v);
}

/* Per-level ROM for this case, falling back to a plausible neutral when a
   level has no film yet. Fused levels are hard zero. */
function levelRom(c, tpk){
  const G=SPINE_GEOM[c.region]; if(!G) return {};
  const r=c.radio[tpk]||c.radio[(latestRadio(c)||{}).k]||c.radio.pre||null;
  const out={};
  G.discs.forEach(d=>{
    const tx = c.levels[d]? c.levels[d].tx : null;
    if(tx && TX[tx] && TX[tx].motion===false){ out[d]=0; return; }
    if(r && r.rom && r.rom[d]!=null){ out[d]=r.rom[d]; return; }
    out[d] = c.region==='Cervical'? 8.5 : 6.5;     // untreated level, population mean
  });
  return out;
}
/* rotations for neutral / flexion / extension */
function rotsFor(region, rom, mode){
  const G=SPINE_GEOM[region];
  const rots=[...G.neutral];
  if(mode==='neutral') return rots;
  const share = mode==='flexion'? 0.55 : -0.45;
  let acc=0;
  for(let i=0;i<rots.length;i++){
    rots[i]+=acc;
    const d=G.discs[i];
    if(d!=null && i<G.discs.length) acc += share*(rom[d]??0);
  }
  return rots;
}

/* ---- measurements, all taken off the drawn geometry ---- */
function measure(region, bodies){
  const rots = bodies.map(b=>b.rot);
  const G=SPINE_GEOM[region], mm=G.mmPerPx;
  const top=bodies.length-1, bot=0;
  const m={};
  /* segmental angles: disc i sits between body i and body i+1 */
  m.segmental={};
  G.discs.forEach((d,i)=>{ m.segmental[d]= +(rots[i]-rots[i+1]).toFixed(1); });

  if(region==='Cervical'){
    /* C2-C7 lordosis: C2 inferior endplate vs C7 inferior endplate (negative rot = lordosis) */
    const iC2=G.bodies.indexOf('C2'), iC7=G.bodies.indexOf('C7');
    m.CL = +(rots[iC7]-rots[iC2]).toFixed(1);
    m.T1S = +rots[G.bodies.indexOf('T1')].toFixed(1);
    m.T1S_CL = +(m.T1S-m.CL).toFixed(1);
    /* C2-C7 SVA: plumb from C2 centroid to postero-superior corner of C7 */
    const c2=bodies[iC2], c7=bodies[iC7];
    const pc7=corner(c7,1,-1);
    m.SVA = +((c2.cx - pc7.x)*mm*-1).toFixed(1);
  } else {
    const iL1=G.bodies.indexOf('L1'), iS1=G.bodies.indexOf('S1');
    m.LL = +(rots[iS1]-rots[iL1]).toFixed(1);
    m.SS = +rots[iS1].toFixed(1);
    /* femoral head placed anterior-inferior to S1; PI from the S1 endplate normal */
    const s1=bodies[iS1];
    const mid=corner(s1,0,-1);
    const fh={x:mid.x-14, y:mid.y+64};
    m.fh=fh; m.s1mid=mid;
    const v={x:mid.x-fh.x, y:mid.y-fh.y};
    const lineAngle = toDeg(Math.atan2(v.x, -v.y));   // from vertical
    m.PT = +lineAngle.toFixed(1);
    m.PI = +(m.PT + m.SS).toFixed(1);
    m.PI_LL = +(m.PI - m.LL).toFixed(1);
    const l1=bodies[iL1];
    m.SVA = +((l1.cx - corner(s1,1,-1).x)*mm*-1).toFixed(1);
    /* lordosis distribution index: share of LL from L4-S1 */
    const lower = (m.segmental['L5-S1']||0)+(m.segmental['L4-L5']||0);
    m.LDI = m.LL? +(100*lower/m.LL).toFixed(0) : null;
  }
  return m;
}

/* Union bounding box across all three modes, so the film never jumps when
   the viewer toggles between neutral, flexion and extension. */
function spineBBox(region, rom, corMap){
  const G=SPINE_GEOM[region];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const seen=p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);};
  ['neutral','flexion','extension'].forEach(mode=>{
    buildPose(region,rom,mode,corMap).forEach(b=>{
      [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>seen(corner(b,sx,sy)));
      const r=DEG(b.rot), len=region==='Cervical'?22:26, sp=corner(b,1,0);
      seen({x:sp.x+Math.cos(r)*len, y:sp.y+Math.sin(r)*len});
    });
    if(region==='Lumbar'){
      /* the femoral head sits below the sacrum and must stay on the film */
      const s1=buildPose(region,rom,mode,corMap)[G.bodies.indexOf('S1')];
      const mid=corner(s1,0,-1);
      seen({x:mid.x-14-18, y:mid.y+64+18});
      seen({x:mid.x-14+18, y:mid.y+64+18});
    }
  });
  return {x0,y0,x1,y1};
}

/* ---- the drawn film ---- */
function filmSvg(c, mode, overlay, rom, corMap, showCor){
  const region=c.region, G=SPINE_GEOM[region];
  if(!G) return el('div',{class:'empty'},'Schematic view not available for this region in the prototype.');
  const bodies=buildPose(region, rom, mode, corMap);
  const rots=bodies.map(b=>b.rot);
  const m=measure(region, bodies);
  const bb=spineBBox(region, rom, corMap);
  const PAD={l:54, r:80, t:36, b:40};
  const VX=bb.x0-PAD.l, VY=bb.y0-PAD.t;
  const W=(bb.x1-bb.x0)+PAD.l+PAD.r, H=(bb.y1-bb.y0)+PAD.t+PAD.b;
  const S=[];
  const add=(t,a)=>S.push(svgEl(t,a));
  const txt=(s,a)=>{const n=svgEl('text',a); n.textContent=s; S.push(n); return n;};

  add('rect',{x:VX,y:VY,width:W,height:H,fill:'#0d1117',rx:8});

  /* discs first */
  G.discs.forEach((d,i)=>{
    const lo=bodies[i], up=bodies[i+1];
    const p=[corner(lo,-1,-1),corner(lo,1,-1),corner(up,1,1),corner(up,-1,1)];
    const tx = c.levels[d]? c.levels[d].tx : null;
    let fill='#9fb0c4', op=.5;
    if(tx==='fusion'){ fill='#d9622e'; op=.85; }
    else if(tx==='adr'){ fill='#3fd7a7'; op=.9; }
    else if(tx==='facet'||tx==='dynamic'||tx==='interspinous'){ fill='#4192cc'; op=.88; }
    const n=svgEl('path',{d:'M'+p.map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' L')+' Z',
      fill, opacity:op});
    const t=svgEl('title'); t.textContent = `${d}: ${tx?TX[tx].label:'native disc'} · ${fmt(m.segmental[d],1)}°`;
    n.append(t); S.push(n);
    if(tx==='adr'){
      const cmid={x:(p[0].x+p[1].x+p[2].x+p[3].x)/4, y:(p[0].y+p[1].y+p[2].y+p[3].y)/4};
      add('circle',{cx:cmid.x,cy:cmid.y,r:2.6,fill:'#0d2b26'});
    }
  });
  /* vertebral bodies + posterior elements */
  bodies.forEach((b,i)=>{
    add('path',{d:bodyPath(b),fill:'#e8edf3',opacity:.93,stroke:'#aab8c8','stroke-width':.8});
    const sp1=corner(b,1,-0.45), sp2=corner(b,1,0.45);
    const r=DEG(b.rot), len=region==='Cervical'?22:26;
    add('path',{d:`M${sp1.x},${sp1.y} L${sp1.x+Math.cos(r)*len},${sp1.y+Math.sin(r)*len} `+
      `L${sp2.x+Math.cos(r)*len},${sp2.y+Math.sin(r)*len} L${sp2.x},${sp2.y} Z`,
      fill:'#e8edf3',opacity:.55});
    txt(b.name,{x:corner(b,-1,0).x-13,y:corner(b,-1,0).y+3.5,fill:'#8fa3b8','font-size':9.5,'text-anchor':'end'});
  });

  if(overlay){
    const O='#3987e5', A='#eda100', R='#ff6b6b';
    if(region==='Cervical'){
      const iC2=G.bodies.indexOf('C2'), iC7=G.bodies.indexOf('C7'), iT1=G.bodies.indexOf('T1');
      [[iC2,O],[iC7,O],[iT1,A]].forEach(([idx,col])=>{
        const b=bodies[idx], a=corner(b,-1,1), p=corner(b,1,1);
        const ext=26, r=DEG(b.rot);
        add('line',{x1:a.x-Math.cos(r)*ext,y1:a.y-Math.sin(r)*ext,
          x2:p.x+Math.cos(r)*ext,y2:p.y+Math.sin(r)*ext,stroke:col,'stroke-width':1.3,'stroke-dasharray':'4 3'});
      });
      const c2=bodies[iC2], c7=bodies[iC7], pc7=corner(c7,1,-1);
      add('line',{x1:c2.cx,y1:c2.cy-16,x2:c2.cx,y2:pc7.y+16,stroke:R,'stroke-width':1.1,'stroke-dasharray':'3 3'});
      add('line',{x1:c2.cx,y1:pc7.y,x2:pc7.x,y2:pc7.y,stroke:R,'stroke-width':1.6});
      /* The SVA offset is often only a few millimetres, so a label centred on
         its own measurement line lands on top of the vertebral bodies. Park it
         in the film's top-right corner, opposite the view title, where nothing else sits. */
      txt(`C2\u2013C7 SVA ${m.SVA>0?'+':''}${m.SVA} mm`,
        {x:VX+W-15, y:VY+25, fill:R,'font-size':10,'text-anchor':'end','font-weight':650});
    } else {
      const iL1=G.bodies.indexOf('L1'), iS1=G.bodies.indexOf('S1');
      [[iL1,O],[iS1,A]].forEach(([idx,col])=>{
        const b=bodies[idx], a=corner(b,-1,idx===iS1?-1:1), p=corner(b,1,idx===iS1?-1:1);
        const ext=30, r=DEG(b.rot);
        add('line',{x1:a.x-Math.cos(r)*ext,y1:a.y-Math.sin(r)*ext,
          x2:p.x+Math.cos(r)*ext,y2:p.y+Math.sin(r)*ext,stroke:col,'stroke-width':1.3,'stroke-dasharray':'4 3'});
      });
      add('circle',{cx:m.fh.x,cy:m.fh.y,r:14,fill:'none',stroke:A,'stroke-width':1.2,opacity:.85});
      add('circle',{cx:m.fh.x,cy:m.fh.y,r:2.2,fill:A});
      add('line',{x1:m.fh.x,y1:m.fh.y,x2:m.s1mid.x,y2:m.s1mid.y,stroke:A,'stroke-width':1.3});
      add('line',{x1:m.fh.x,y1:m.fh.y,x2:m.fh.x,y2:m.fh.y-70,stroke:R,'stroke-width':1,'stroke-dasharray':'3 3'});
      txt('PI '+m.PI+'°',{x:m.fh.x-6,y:m.fh.y+26,fill:A,'font-size':10,'text-anchor':'middle','font-weight':650});
    }
    /* segmental angle labels */
    G.discs.forEach((d,i)=>{
      const lo=bodies[i], up=bodies[i+1];
      const mx=(lo.cx+up.cx)/2, my=(lo.cy+up.cy)/2;
      txt(`${m.segmental[d]>0?'+':''}${m.segmental[d]}°`,
        {x:mx+G.w/2+30,y:my+3,fill:'#9fd9c6','font-size':9.5,'text-anchor':'start'});
    });
  }
  if(showCor){
    const bF=buildPose(region,rom,'flexion',corMap), bE=buildPose(region,rom,'extension',corMap);
    G.discs.forEach((d,i)=>{
      const mm=measureCOR(bF,bE,i);
      const lo=bodies[i];
      const ref=COR_REF[d];
      if(ref){
        const p0=corGlobal(lo,{u:ref.u-COR_TOL*0.72,v:ref.v-COR_TOL*0.72});
        const p1=corGlobal(lo,{u:ref.u+COR_TOL*0.72,v:ref.v+COR_TOL*0.72});
        add('rect',{x:Math.min(p0.x,p1.x),y:Math.min(p0.y,p1.y),
          width:Math.abs(p1.x-p0.x),height:Math.abs(p1.y-p0.y),rx:3,
          fill:'none',stroke:'#4192cc','stroke-width':1,'stroke-dasharray':'3 3',opacity:.75});
      }
      if(!mm.computable) return;
      const p=corGlobal(lo,{u:mm.u,v:mm.v});
      const dev=corDeviation(d,mm);
      const col = dev!=null && dev>COR_TOL ? '#ff7a6e' : '#3fd7a7';
      const n1=svgEl('circle',{cx:p.x,cy:p.y,r:4.6,fill:'none',stroke:col,'stroke-width':1.8});
      const n2=svgEl('line',{x1:p.x-7,y1:p.y,x2:p.x+7,y2:p.y,stroke:col,'stroke-width':1.1});
      const n3=svgEl('line',{x1:p.x,y1:p.y-7,x2:p.x,y2:p.y+7,stroke:col,'stroke-width':1.1});
      const t=svgEl('title');
      t.textContent=`${d} center of rotation \u2014 ${Math.round(mm.u*100)}% depth, ${Math.round(mm.v*100)}% height`+
        (dev!=null? ` \u00b7 deviation ${(dev*100).toFixed(0)}%`:'');
      n1.append(t);
      S.push(n1,n2,n3);
    });
  }
  txt(mode.charAt(0).toUpperCase()+mode.slice(1),
    {x:VX+15,y:VY+25,fill:'#8fa3b8','font-size':12,'font-weight':650,'letter-spacing':'0.08em'});
  txt('SCHEMATIC — SYNTHETIC',{x:VX+W-15,y:VY+H-14,fill:'#55657a','font-size':9,'text-anchor':'end','letter-spacing':'0.1em'});

  const svg=svgEl('svg',{viewBox:`${VX} ${VY} ${W} ${H}`,role:'img',
    'aria-label':`Schematic lateral ${region.toLowerCase()} radiograph in ${mode}`});
  S.forEach(n=>svg.append(n));
  return {svg, m, bodies, rots};
}

/* ---- cohort-level axis-of-rotation analysis ----
   Per case we classify the TREATED mobile levels only: a level whose axis sits
   inside COR_TOL of its normative position is physiological, outside it is
   displaced, and below COR_MIN_ROM it has no measurable axis at all. A case
   takes the worst status among its treated levels, because one badly tracking
   level is what loads the facets. */
function corStatus(c){
  const G=SPINE_GEOM[c.region]; if(!G) return null;
  const tx = c.construct.indexLevels.filter(l=>c.levels[l] && TX[c.levels[l].tx].motion!==false);
  if(!tx.length) return null;
  const rom=levelRom(c,(latestRadio(c)||{}).k), cm=corMapFor(c);
  const bF=buildPose(c.region,rom,'flexion',cm), bE=buildPose(c.region,rom,'extension',cm);
  let worst='physiological', devMax=0, any=false;
  tx.forEach(l=>{
    const i=G.discs.indexOf(l); if(i<0) return;
    const m=measureCOR(bF,bE,i); any=true;
    if(!m.computable){ worst='none'; return; }
    const ref=COR_REF[l]||{u:0.38,v:0.35};
    const dev=Math.hypot(m.u-ref.u, m.v-ref.v)/COR_TOL;
    devMax=Math.max(devMax,dev);
    if(dev>1 && worst!=='none') worst='displaced';
  });
  return any? {status:worst, dev:devMax, levels:tx.length} : null;
}
function corCohort(){
  const rows={physiological:[], displaced:[], none:[]};
  CASES.forEach(c=>{ const s=corStatus(c); if(s) rows[s.status].push(c); });
  const stat = cs=>{
    const wp=cs.filter(c=>c.proms.pre && latestProm(c));
    if(!wp.length) return {n:cs.length, nProm:0, d:null, mcid:null};
    const d=mean(wp.map(c=>c.proms.pre.primary - latestProm(c).v.primary));
    const m=wp.filter(c=>(c.proms.pre.primary-latestProm(c).v.primary) >= MCID(c)).length;
    return {n:cs.length, nProm:wp.length, d, mcid:100*m/wp.length};
  };
  /* level-wise counts by device family, for the exposure table */
  const byTx={};
  CASES.forEach(c=>{
    const G=SPINE_GEOM[c.region]; if(!G) return;
    const rom=levelRom(c,(latestRadio(c)||{}).k), cm=corMapFor(c);
    const bF=buildPose(c.region,rom,'flexion',cm), bE=buildPose(c.region,rom,'extension',cm);
    c.construct.indexLevels.forEach(l=>{
      const i=G.discs.indexOf(l); if(i<0||!c.levels[l]) return;
      const t=c.levels[l].tx; const lab=TX[t]? TX[t].short||TX[t].label||t : t;
      if(TX[t] && TX[t].motion===false) return;
      byTx[lab]=byTx[lab]||{n:0,disp:0,none:0};
      const b=byTx[lab]; b.n++;
      const m=measureCOR(bF,bE,i);
      if(!m.computable){ b.none++; return; }
      const ref=COR_REF[l]||{u:0.38,v:0.35};
      if(Math.hypot(m.u-ref.u,m.v-ref.v)/COR_TOL>1) b.disp++;
    });
  });
  return {phys:stat(rows.physiological), disp:stat(rows.displaced),
          none:stat(rows.none), byTx};
}

/* ---- the patient-page card ---- */
function alignmentViewer(c){

  const wrap=el('div',{});

  let mode='neutral', overlay=true, showCor=false;
  const rom=levelRom(c, (latestRadio(c)||{}).k);
  const corMap=corMapFor(c);

  const draw=()=>{
    wrap.innerHTML='';
    const f=filmSvg(c, mode, overlay, rom, corMap, showCor);
    const neutral=filmSvg(c,'neutral',false,rom,corMap).m;
    const flex=filmSvg(c,'flexion',false,rom,corMap).m;
    const ext=filmSvg(c,'extension',false,rom,corMap).m;
    const bF=buildPose(c.region,rom,'flexion',corMap), bE=buildPose(c.region,rom,'extension',corMap);
    const corRows=G.discs.map((d,i)=>({d, m:measureCOR(bF,bE,i), tx:(c.levels[d]?c.levels[d].tx:null)}));
    const romRows=G.discs.map(d=>{
      const r=+(ext.segmental[d]-flex.segmental[d]).toFixed(1);
      const tx=c.levels[d]? c.levels[d].tx : null;
      return {d, r, tx, flex:flex.segmental[d], ext:ext.segmental[d]};
    });
    const align = c.region==='Cervical'
      ? [['C2–C7 lordosis', neutral.CL+'°', 'Cobb, C2 to C7 inferior endplates'],
         ['T1 slope', neutral.T1S+'°', 'Normative 15–25°'],
         ['T1S − CL mismatch', neutral.T1S_CL+'°', '>15–20° predicts disability', Math.abs(neutral.T1S_CL)>15],
         ['C2–C7 SVA', neutral.SVA+' mm', '>40 mm predicts worse NDI', Math.abs(neutral.SVA)>40]]
      : [['L1–S1 lordosis', neutral.LL+'°', 'Cobb, L1 superior to S1 superior'],
         ['Pelvic incidence', neutral.PI+'°', 'Morphological constant'],
         ['Sacral slope', neutral.SS+'°', ''],
         ['Pelvic tilt', neutral.PT+'°', '<20° target', Math.abs(neutral.PT)>20],
         ['PI − LL mismatch', neutral.PI_LL+'°', '>10° raises ASD risk ≈ 10-fold', Math.abs(neutral.PI_LL)>10],
         ['Lordosis distribution', (neutral.LDI??'—')+'%', 'L4–S1 share of total lordosis'],
         ['L1–S1 SVA', neutral.SVA+' mm','']];

    wrap.append(
      el('div',{class:'grid',style:'grid-template-columns:420px 1fr;gap:18px;align-items:start'},
        el('div',{},
          el('div',{class:'row',style:'margin-bottom:10px'},
            el('div',{class:'chips'},
              ['neutral','flexion','extension'].map(x=>
                el('button',{class:'chip',type:'button','aria-pressed':String(mode===x),
                  onclick:()=>{mode=x;draw();}}, x.charAt(0).toUpperCase()+x.slice(1)))),
            el('div',{class:'spacer'}),
            el('button',{class:'chip',type:'button','aria-pressed':String(overlay),
              onclick:()=>{overlay=!overlay;draw();}},'Measurements'),
            el('button',{class:'chip',type:'button','aria-pressed':String(showCor),
              onclick:()=>{showCor=!showCor;draw();}},'Axis of rotation')),
          f.svg,
          el('div',{class:'hint',style:'margin-top:9px'},
            'Drawn from this patient’s recorded segmental angles. Flexion and extension are generated by redistributing each level’s measured ROM, so the film cannot disagree with the dataset.')),

        el('div',{},
          el('h4',{style:'font-size:13px;margin-bottom:9px'},'Alignment — neutral standing'),
          tableEl([{label:'Parameter',key:'p'},{label:'Value',key:'v',num:true,mono:true},{label:'Reference',key:'r'}],
            align.map(([p,v,r,flag])=>({
              p, v: flag? el('span',{class:'st crit'},v) : v,
              r: el('span',{class:'hint',style:'margin:0'},r)}))),
          el('h4',{style:'font-size:13px;margin:16px 0 9px'},'Segmental motion — flexion/extension pair'),
          tableEl([{label:'Level',key:'l'},{label:'Flexion',key:'f',num:true,mono:true},
                   {label:'Extension',key:'e',num:true,mono:true},{label:'ROM',key:'r',num:true,mono:true},
                   {label:'',key:'s'}],
            romRows.map(x=>({
              l: el('strong',{},x.d),
              f: fmt(x.flex,1)+'°', e: fmt(x.ext,1)+'°',
              r: el('strong',{}, fmt(x.r,1)+'°'),
              s: x.tx==='fusion'? el('span',{class:'tag o'},'Fused')
                 : x.r<MOBILE_THRESHOLD? el('span',{class:'st crit'},'Below 3°')
                 : el('span',{class:'st good'},'Mobile')}))),
          el('div',{class:'hint',style:'margin-top:10px'},
            'ROM is computed as the difference between the two films, exactly as it would be from a real flexion-extension pair — not read from a stored field.'),

          el('h4',{style:'font-size:13px;margin:18px 0 9px'},'Quality of motion — center of rotation'),
          tableEl([{label:'Level',key:'l'},{label:'Depth',key:'u',num:true,mono:true},
                   {label:'Height',key:'v',num:true,mono:true},
                   {label:'Deviation',key:'dv',num:true,mono:true},{label:'',key:'s'}],
            corRows.map(x=>{
              if(!x.m.computable) return {l:el('strong',{},x.d), u:'—', v:'—', dv:'—',
                s: x.tx==='fusion'? el('span',{class:'tag o'},'Fused')
                   : el('span',{class:'st mute'},'Below '+COR_MIN_ROM+'° — not computable')};
              const dev=corDeviation(x.d,x.m);
              return {l:el('strong',{},x.d),
                u:Math.round(x.m.u*100)+'%', v:Math.round(x.m.v*100)+'%',
                dv: dev==null?'—':Math.round(dev*100)+'%',
                s: dev==null? '' : dev>COR_TOL
                   ? el('span',{class:'st crit'},'Axis displaced')
                   : el('span',{class:'st good'},'Physiological')};
            })),
          el('div',{class:'hint',style:'margin-top:10px'},
            'Depth is measured from the posterior wall of the vertebra below, height from its superior endplate. The axis is recovered by fitting the rigid motion between the two films and solving for its fixed point — below '+COR_MIN_ROM+'° of rotation that point is mathematically unstable, so it is reported as not computable rather than guessed.'),
          el('div',{class:'banner',style:'margin-top:12px'},
            el('span',{html:ICON.info}),
            el('div',{html:'<b>Why the axis matters as well as the degrees.</b> A segment can show normal degrees while rotating about an abnormal point, which loads the facets and the adjacent disc unevenly. Published series report that a device can preserve the <em>amount</em> of motion while shifting the axis, and that an abnormal axis beside a fusion may drive adjacent-level degeneration. Those series include tens of patients; this registry tracks the axis by device, at scale, for ten years.'})))));
  };
  draw();
  return wrap;
}

/* ======================= care timeline =======================
   The patient's whole course on one shared time axis: what was done, what
   happened, what was imaged, and the outcome curves underneath. Stacked
   panels rather than stacked y-axes — the units differ, so the scales must.
   ============================================================= */
function careTimeline(c){
  const tps = TIMEPOINTS.filter(t=>t.days<=c.daysSince);
  const t0 = c.date.getTime() - 210*864e5;
  const lastDays = Math.max(c.daysSince, 365);
  const t1 = c.date.getTime() + (lastDays+200)*864e5;
  const W=900, M={l:112,r:18};
  const LANE_H=26, LANES=4, PANEL_H=74, GAP=10;
  const laneTop=28, panelTop = laneTop + LANES*LANE_H + 16;
  const H = panelTop + 3*(PANEL_H+GAP) + 26;
  const x = ms => M.l + (ms-t0)/(t1-t0)*(W-M.l-M.r);
  const dayX = d => x(c.date.getTime()+d*864e5);

  const S=[];
  const push=(t,a)=>S.push(svgEl(t,a));
  const text=(s,a)=>{const n=svgEl('text',a); n.textContent=s; S.push(n); return n;};

  /* --- visit gridlines across the whole figure --- */
  tps.forEach(t=>{
    push('line',{x1:dayX(t.days),x2:dayX(t.days),y1:laneTop-4,y2:H-24,
      stroke:CSS('--s1'),'stroke-width':1,opacity:.17});
  });
  /* surgery line */
  push('line',{x1:dayX(0),x2:dayX(0),y1:laneTop-8,y2:H-24,stroke:CSS('--s2'),'stroke-width':1.6,opacity:.55});
  text('Surgery',{x:dayX(0)+5,y:laneTop-10,fill:CSS('--s2'),'font-size':10.5,'font-weight':650});

  /* --- lane 1: treatments --- */
  const laneY = i => laneTop + i*LANE_H + LANE_H/2;
  const laneNames=[['Treatments',CSS('--s2')],['Events',CSS('--crit')],
                   ['Imaging',CSS('--s3')],['Visits / PROM',CSS('--s1')]];
  laneNames.forEach(([n,col],i)=>{
    text(n,{x:M.l-10,y:laneY(i)+3.5,fill:CSS('--muted'),'font-size':10.5,'text-anchor':'end',class:'lanelab'});
    push('line',{x1:M.l,x2:W-M.r,y1:laneY(i)+LANE_H/2-1,y2:laneY(i)+LANE_H/2-1,
      stroke:CSS('--grid'),'stroke-width':1});
  });
  const marker=(gx,gy,kind,col,label,title)=>{
    let n;
    if(kind==='sq') n=svgEl('rect',{x:gx-5,y:gy-5,width:10,height:10,rx:2.5,fill:col});
    else if(kind==='di') n=svgEl('path',{d:`M${gx},${gy-6} L${gx+6},${gy} L${gx},${gy+6} L${gx-6},${gy} Z`,fill:col});
    else if(kind==='tri') n=svgEl('path',{d:`M${gx},${gy-6} L${gx+5.5},${gy+5} L${gx-5.5},${gy+5} Z`,fill:col});
    else n=svgEl('circle',{cx:gx,cy:gy,r:4.5,fill:col});
    const t=svgEl('title'); t.textContent=title||label; n.append(t);
    S.push(n);
  };
  /* conservative care before surgery */
  marker(dayX(-180), laneY(0), 'ci', CSS('--muted'), 'Physical therapy', 'Physical therapy — pre-operative');
  marker(dayX(-95),  laneY(0), 'ci', CSS('--muted'), 'Injection', 'Epidural / facet injection');
  marker(dayX(0),    laneY(0), 'sq', CSS('--s2'), 'Index surgery', 'Index surgery — '+c.construct.type);
  if(c.reop) marker(dayX(TP[c.reop.tp].days), laneY(0), 'sq', CSS('--crit'), 'Reoperation', 'Secondary surgery — '+c.reop.reason);

  /* events */
  if(c.asd && c.asdTp) marker(dayX(TP[c.asdTp].days), laneY(1), 'tri', CSS('--crit'), 'ASD', 'Symptomatic adjacent segment disease recorded');
  (c.aes||[]).forEach(a=>{
    const d=(new Date(a.onset)-c.date)/864e5;
    if(!isFinite(d)) return;
    marker(dayX(d), laneY(1), 'tri', a.serious==='Yes'? CSS('--crit') : CSS('--warn'),
      a.type, a.type+(a.severity?' — '+a.severity:'')+(a.serious==='Yes'?' (SAE)':''));
  });
  (c.procedures||[]).forEach(p=>{
    const d=(new Date(p.date)-c.date)/864e5;
    if(!isFinite(d)) return;
    marker(dayX(d), laneY(0), 'sq', p.region!==c.region? CSS('--s3') : CSS('--crit'),
      p.kind, p.region+' — '+p.kind+': '+p.construct.type);
  });
  (c.tests||[]).forEach(t=>{
    const d=(new Date(t.date)-c.date)/864e5;
    if(!isFinite(d)) return;
    marker(dayX(d), laneY(2), 'di', CSS('--s3'), t.type, t.type+' — '+t.date);
  });
  if(c.hoGrade>=3){
    const k=RADIO_TPS.filter(k=>k!=='pre'&&c.radio[k]&&c.radio[k].ho>=3)[0];
    if(k) marker(dayX(TP[k].days), laneY(1), 'tri', CSS('--s2'), 'HO III–IV', 'Motion-restricting heterotopic ossification (McAfee '+c.hoGrade+')');
  }
  if(c.ankylosed){
    const k=RADIO_TPS.filter(k=>k!=='pre'&&c.radio[k]&&romAt(c,k)!=null&&romAt(c,k)<MOBILE_THRESHOLD)[0];
    if(k) marker(dayX(TP[k].days), laneY(1), 'tri', CSS('--crit'), 'Motion lost', 'Index level fell below '+MOBILE_THRESHOLD+'° — motion lost');
  }
  /* imaging */
  marker(dayX(-150), laneY(2), 'di', CSS('--s3'), 'MRI', 'MRI — diagnostic');
  RADIO_TPS.filter(k=>c.radio[k]).forEach(k=>{
    marker(dayX(k==='pre'?-14:TP[k].days), laneY(2), 'di', CSS('--s3'),
      'Flex-ex X-ray', `Flexion-extension radiographs — ${TP[k].label}`);
  });
  /* visits */
  tps.forEach(t=>{
    const s=fuStatus(c,t.k);
    const col = t.k==='pre'? CSS('--s1') : s==='captured'? CSS('--s1') : s==='due'? CSS('--warn') : CSS('--crit');
    marker(dayX(t.days), laneY(3), 'ci', col, t.label, `${t.label} — ${t.k==='pre'?'baseline':s}`);
  });

  /* --- outcome panels --- */
  const panel = (idx, label, unitMax, series, fmtV) => {
    const top = panelTop + idx*(PANEL_H+GAP);
    push('line',{x1:M.l,x2:W-M.r,y1:top+PANEL_H,y2:top+PANEL_H,stroke:CSS('--baseline'),'stroke-width':1});
    push('line',{x1:M.l,x2:W-M.r,y1:top,y2:top,stroke:CSS('--grid'),'stroke-width':1});
    text(label,{x:M.l-10,y:top+13,fill:CSS('--ink-2'),'font-size':10.5,'text-anchor':'end','font-weight':650});
    text(String(unitMax),{x:M.l-10,y:top+26,fill:CSS('--muted'),'font-size':9.5,'text-anchor':'end'});
    text('0',{x:M.l-10,y:top+PANEL_H+3,fill:CSS('--muted'),'font-size':9.5,'text-anchor':'end'});
    const py = v => top + PANEL_H*(1-v/unitMax);
    series.forEach(s=>{
      const pts=s.pts.filter(p=>p.v!=null);
      if(pts.length>1) push('path',{d:pts.map((p,i)=>`${i?'L':'M'}${dayX(p.d)},${py(p.v)}`).join(' '),
        fill:'none',stroke:s.color,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
      pts.forEach(p=>{
        const n=svgEl('circle',{cx:dayX(p.d),cy:py(p.v),r:3.6,fill:s.color,stroke:CSS('--surface'),'stroke-width':1.6});
        const t=svgEl('title'); t.textContent=`${s.name} — ${p.label}: ${fmtV?fmtV(p.v):p.v}`; n.append(t);
        S.push(n);
      });
    });
  };
  const promPts = key => tps.map(t=>({d:t.days, v:c.proms[t.k]? c.proms[t.k][key] : null, label:t.label}));
  panel(0, c.region==='Cervical'?'NDI':'ODI', 100,
    [{name:c.region==='Cervical'?'NDI':'ODI', color:CSS('--s1'), pts:promPts('primary')}]);
  panel(1, 'NRS pain', 10,
    [{name:c.region==='Cervical'?'Neck':'Back', color:CSS('--s2'), pts:promPts('axial')},
     {name:c.region==='Cervical'?'Arm':'Leg',  color:CSS('--s4'), pts:promPts('limb')}], v=>fmt(v,1));
  panel(2, 'Segmental ROM', 12,
    [{name:'Index level', color:CSS('--s3'),
      pts:RADIO_TPS.filter(k=>c.radio[k]).map(k=>({d:k==='pre'?-14:TP[k].days, v:romAt(c,k), label:TP[k].label}))}],
    v=>fmt(v,1)+'°');

  /* x axis: years from surgery */
  const years = Math.ceil(lastDays/365);
  for(let y=0;y<=years;y++){
    const gx=dayX(y*365);
    if(gx>W-M.r) break;
    text(y===0?'Surgery':y+(y===1?' yr':' yrs'),{x:gx,y:H-8,fill:CSS('--muted'),'font-size':10.5,'text-anchor':'middle'});
  }

  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'Care timeline for '+c.id});
  S.forEach(n=>svg.append(n));
  return el('div',{class:'ctl'}, svg);
}

/* ===================== cohort grouping ===================== */
const RADIO_TPS = ['pre','3m','1y','2y','3y','5y','7y','10y'];
const GROUPS = [
  {key:'adr1',  name:'1-level ADR',        test:c=>c.construct.family==='adr'&&c.construct.indexLevels.length===1},
  {key:'adrN',  name:'Multilevel ADR',     test:c=>c.construct.family==='adr'&&c.construct.indexLevels.length>1},
  {key:'hyb',   name:'Hybrid ADR + fusion',test:c=>c.construct.family==='hybrid'},
  {key:'facet', name:'Facet arthroplasty', test:c=>c.construct.family==='facet'||c.construct.family==='multi_arthro'},
];
function groupRomSeries(){
  return GROUPS.map((g,i)=>({
    name:g.name, color:CSS(SERIES[i]),
    points: RADIO_TPS.map(tpk=>{
      const vals = CASES.filter(g.test).map(c=>romAt(c,tpk)).filter(v=>v!=null);
      return {y: vals.length>=3? mean(vals) : null, n: vals.length};
    })
  }));
}
function constructMix(){
  const m=new Map();
  for(const c of CASES){
    const k=c.construct.type.replace(/ \(comparator arm\)/,'');
    m.set(k,(m.get(k)||0)+1);
  }
  return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10)
    .map(([label,value])=>({label,value,unit:'Cases'}));
}

/* ========================== DASHBOARD ========================== */
function renderDashboard(){
  const motionCases = CASES.filter(c=>c.construct.mobile>0 && !['fusion','decomp'].includes(c.construct.family));

  }).filter(v=>v!=null);

  const queue = dueNow();

  const romSeries = groupRomSeries();
  const fuGroups = ['3m','1y','2y','3y','5y','7y','10y'].map(k=>({label:TP[k].label,k}));

  return el('div',{},

      (()=>{const oq=allQueries().filter(q=>q.status==='Open').length;
        return tile('Open data queries', String(oq),
          oq? 'Routed to the sites that own them':'Queue clear', oq?'bad':'good');})(),
      (()=>{const n=CASES.filter(c=>(c.aes||[]).length).length;
        return tile('Cases with adverse events', String(n), 'Graded and assessed for relatedness');})(),
      (()=>{const avg=Math.round(mean(CASES.map(c=>completeness(c).pct)));
        return tile('Mean record completeness', `${avg}<small>%</small>`,
          'Across every enrolled case', avg>=85?'good':'bad');})()),

    el('div',{class:'mt'},
      el('div',{class:'banner warn'},
